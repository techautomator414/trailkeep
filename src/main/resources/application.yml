spring:
  application:
    name: trailkeep
  profiles:
    # Every runtime profile pulls in exactly one database vendor profile (application-postgresql.yml or
    # application-oracle.yml). There is deliberately no vendor default: an unset vendor fails at start-up
    # (app.db.vendor is @NotNull) instead of migrating Oracle with PostgreSQL placeholders.
    group:
      local: postgresql
      # The two Testcontainers profiles share application-test-common.yml (proxy placeholder, grantees, OIDC test
      # client and unreachable provider endpoints), so a context-start requirement is never set for one vendor only.
      test: postgresql, test-common
      oracle-test: oracle, test-common

  jpa:
    open-in-view: false
    hibernate:
      # The migration tool owns the schema; Hibernate only checks it. prod must never override this.
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_boolean_jdbc_type: BIT
        default_batch_fetch_size: 50
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # hibernate.default_schema is applied from app.db.schema by PersistenceConfig, only when it is set.

  flyway:
    # {vendor} is resolved by Spring Boot from the DataSource ("oracle" or "postgresql"), which matches the
    # vendor folder names. PersistenceConfig fails start-up if it disagrees with app.db.vendor.
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/{vendor}
    fail-on-missing-locations: true
    validate-migration-naming: true
    validate-on-migrate: true
    clean-disabled: true
    # Placeholder values per vendor (BUILD_PLAN Appendix A) live in application-{oracle,postgresql}.yml.
    placeholder-replacement: true
    placeholders:
      # Grantees of the vendor R__grants.sql (BUILD_PLAN section 8 rule 7). Deliberately no defaults here: a
      # deployment that does not name its runtime, purge and import users fails at start-up instead of granting to a
      # guess.
      app_user: ${app.db.app-user}
      purge_user: ${app.db.purge-user}
      import_user: ${app.db.import-user}

  web:
    resources:
      # Content-hashed asset URLs (Part B "Web"): templates write @{/css/app.css}, the response carries
      # /css/app-<md5>.css, and a changed file gets a new URL, so assets can be cached for a year.
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
  session:
    # Spring Session JDBC (ADR-0008). The schema is V3_1__sessions; Spring Session never creates tables.
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  thymeleaf:
    servlet:
      # Render the whole page before writing, so a template error yields the error page, not half a page.
      produce-partial-output-while-processing: false

  servlet:
    multipart:
      # Aligned with the attachment cap (BUILD_PLAN §9). The request may be a little larger than the file: the form's
      # CSRF token and the multipart framing come with it. Keep max-request-size at least 1 MiB above
      # app.attachments.max-bytes: AttachmentConfig refuses to start otherwise.
      max-file-size: ${app.attachments.max-bytes}
      max-request-size: 26MB

  mvc:
    async:
      # A download streams asynchronously (StreamingResponseBody); without this, the container's default (30 s on
      # Tomcat) would cut off a 25 MB file on a slow link.
      request-timeout: 10m

  task:
    scheduling:
      pool:
        size: 4

  # The mail server the outbox dispatcher sends through. spring.mail.host (and port, username, password) is per
  # deployment; while app.mail.enabled is true, startup fails without a host. The timeouts bound one batch of 50 well
  # inside app.mail.lease.
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

  # OIDC login (BUILD_PLAN §9 Identity). The client is per deployment (app.security.oidc.*, the secret from a
  # mounted secret file); the provider's endpoints are set per profile: issuer discovery in local and prod, fixed
  # unreachable endpoints in test so contexts start without an identity provider.
  security:
    oauth2:
      client:
        registration:
          idp:
            provider: idp
            client-id: ${app.security.oidc.client-id}
            client-secret: ${app.security.oidc.client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email

# app.* is bound to io.trailkeep.shared.config.AppProperties. app.proxy.pattern has no default here on purpose:
# every deployment must set it (the local and test profiles carry a placeholder), and startup fails without it.
app:
  timezone: UTC
  security:
    # The provider claim that lists the user's groups, and which groups grant a global role. Team roles are managed
    # in the application, never by the provider. Deployments map their own group names.
    groups-claim: groups
  branding:
    name: Trailkeep
  # Uploads (WP-14). app.attachments.clamd.host has no default here on purpose: a deployment names its scanner or
  # does not start (the local and test profiles set one). The prod temp directory is an emptyDir.
  attachments:
    temp-dir: ${java.io.tmpdir}
    max-bytes: 25MB
    # Who scans uploads for malware (ADR-0013): clamd (Trailkeep scans every upload, fail-closed) or external (the
    # deployment scans upstream or at endpoints; files are stored as NOT_SCANNED, and clamd host and bundle are not
    # needed). Read at startup only: changing it is a redeploy.
    scanning: clamd
    # max-concurrent-downloads (default 8): downloads streaming at once per replica; one more is refused with 503 and
    # Retry-After. Each holds a database connection while it streams, so keep it below the Hikari pool (10 by
    # default), and at most the async executor's core size (spring.task.execution.pool.core-size, 8 by default).
  # CSV export of the cases list (WP-15 part 4): a filter matching more than max-rows cases is refused (422) and the
  # person narrows it. The export streams in pages of 500 rows inside one read-only transaction.
  export:
    max-rows: 10000
  # app.base-url (the address people open the application at, the start of every deep link in a mail) has no default
  # here on purpose: a deployment sets it or does not start (the local and test profiles set one).
  # Outgoing mail (WP-17). The outbox dispatcher runs every minute on every web replica (app.mail.dispatch-cron) and is
  # the only sender. enabled: false stops sending while mail keeps queuing in NOTIFICATION_OUTBOX (sent once it is true
  # again). from is required while enabled. lease: how long a claimed batch is held before the reaper hands it on.
  # The server is spring.mail.* below and per profile.
  mail:
    enabled: true
    lease: 5m
  # SLA evaluator (WP-21, BUILD_PLAN §6): every 15 minutes, on one replica at a time (ShedLock on the SHEDLOCK table).
  # "-" turns it off, as the test profiles do. health-grace: how long after its last success on any replica (JOB_RUN)
  # the evaluator's cluster-level health indicator stays up; two evaluation periods. It is in neither probe group.
  sla:
    evaluate-cron: "0 */15 * * * *"
    health-grace: 30m
  # Reminders tick (WP-17b, BUILD_PLAN §6): hourly, on one replica at a time. Open update requests and pending closure
  # requests are reminded after this many days since they were made or last reminded; health-grace as for the
  # evaluator, two ticks. "-" turns the tick off, as the test profiles do.
  reminders:
    cron: "0 7 * * * *"
    update-request-days: 3
    closure-days: 3
    health-grace: 2h
  # Report delivery (WP-23, BUILD_PLAN §6): hourly, on one replica at a time, it sends each team's aging report when
  # its REPORT_SCHEDULE says. admins-only: for the first cycle after go-live, send to Compliance Admins only, not to the
  # teams' Managers. health-grace as for the reminders tick. "-" turns the job off, as the test profiles do.
  reports:
    delivery-cron: "0 23 * * * *"
    admins-only: false
    health-grace: 2h
  # Retention (WP-24, BUILD_PLAN §4.6): the hourly archive job, on one replica at a time, archives closed cases whose
  # case type's RETENTION_YEARS have passed since they closed (unless on legal hold); purge-grace is how long an
  # archived case is kept before the purge job may tombstone it (PURGE_AFTER). health-grace as for the reminders tick.
  # "-" turns the job off, as the test profiles do.
  retention:
    archive-cron: "0 37 * * * *"
    purge-grace: 30d
    health-grace: 2h
    # The purge job (profile purge, WP-24 part c) also deletes report runs older than this, and first the mail that
    # names them: a run holds case numbers and titles, and its mail links to it.
    report-runs: 400d

server:
  port: 8080
  servlet:
    session:
      # Idle timeout (BUILD_PLAN §9). The 8-hour absolute lifetime is app.security.absolute-session-lifetime; the
      # page's expiry warning reads this value too.
      timeout: 30m
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
  # Honor X-Forwarded-* only from the router (Part A #29 amended r3, BUILD_PLAN §16). Spring Boot's default
  # internal-proxies trusts every RFC 1918 address, which on an intranet is every client, so both lists are
  # overridden with the same regular expression. An unset pattern resolves to "trust nobody" here and is then
  # rejected by AppProperties validation.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${app.proxy.pattern:}
      trusted-proxies: ${app.proxy.pattern:}
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

logging:
  # Plain-text profiles show the request id; the JSON profiles carry it as a field (logback-spring.xml).
  pattern:
    correlation: "[%X{requestId:-}] "

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    mail:
      # The mail server is shared by the cluster, not a property of this pod (Part A #30): it shows as a growing
      # trailkeep.outbox.pending gauge, never as this pod's health.
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      # Probe groups enumerate their members; see io.trailkeep.shared.observability (package Javadoc) for why.
      # Add a pod-local indicator here deliberately; never a cluster-level one (Part A #30).
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
