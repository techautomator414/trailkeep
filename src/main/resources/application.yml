# SPDX-License-Identifier: Apache-2.0
spring:
  application:
    name: trailkeep
  jpa:
    open-in-view: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  server:
    # Separate port so probes and metrics are never exposed through the public route.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
