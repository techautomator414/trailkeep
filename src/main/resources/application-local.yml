# 'local' profile: the PostgreSQL service from compose.yaml. Dev-only credentials, obviously fake.
spring:
  ssl:
    bundle:
      pem:
        clamd:
          truststore:
            # The dev-only CA compose generates on first start (clamav-tls-init). Run `docker compose up -d` first.
            certificate: file:.local/clamd-tls/ca.crt
  datasource:
    url: jdbc:postgresql://localhost:5432/trailkeep
    username: trailkeep
    password: trailkeep
  security:
    oauth2:
      client:
        provider:
          idp:
            # The compose Keycloak with the dev realm (deploy/local/keycloak/trailkeep-dev-realm.json).
            issuer-uri: http://localhost:8180/realms/trailkeep-dev
  mail:
    # The compose Mailpit: it accepts everything and sends nothing on; read the mail at http://localhost:8025.
    host: localhost
    port: 1025

app:
  base-url: http://localhost:8080
  mail:
    from: Trailkeep (local) <trailkeep@example.invalid>
  attachments:
    clamd:
      # The compose ClamAV, through its TLS sidecar on 3311; trusted through the clamd SSL bundle below.
      host: localhost
  # Synthetic case configuration for local development (WP-10), loaded by LocalConfigSeed when missing.
  seed:
    sla-policies:
      - { name: Standard 30 days, anchor: IDENTIFIED_ON, target-days: 30, at-risk-pct: 80, overdue-reminder-days: 7, escalate-to: OWNER_AND_MANAGERS }
      - { name: Urgent 5 days, anchor: OPENED_AT, target-days: 5, at-risk-pct: 60, overdue-reminder-days: 1, escalate-to: OWNER_AND_MANAGERS }
    case-types:
      - { name: Policy exception, sla-policy: Standard 30 days, retention-years: 7, outcomes: [Resolved, No Action Required, Duplicate] }
      - { name: Access review finding, sla-policy: Standard 30 days, retention-years: 7, outcomes: [Resolved, Transferred, Duplicate] }
      - { name: Vendor incident, sla-policy: Urgent 5 days, retention-years: 10, outcomes: [Resolved, No Action Required, Transferred] }
    # Teams Alpha and Beta with the dev-realm users' team roles (deploy/local/keycloak/trailkeep-dev-realm.json), loaded
    # by LocalTeamSeed when missing. external-id is the user's id in the dev realm, which is the OIDC subject.
    teams:
      - name: Alpha
        members:
          - { user: alpha.reader, external-id: "00000000-0000-4000-8000-000000000001", role: READER }
          - { user: alpha.analyst, external-id: "00000000-0000-4000-8000-000000000002", role: ANALYST }
          - { user: alpha.manager1, external-id: "00000000-0000-4000-8000-000000000003", role: MANAGER }
          - { user: alpha.manager2, external-id: "00000000-0000-4000-8000-000000000004", role: MANAGER }
      - name: Beta
        members:
          - { user: beta.reader, external-id: "00000000-0000-4000-8000-000000000005", role: READER }
          - { user: beta.analyst, external-id: "00000000-0000-4000-8000-000000000006", role: ANALYST }
          - { user: beta.manager1, external-id: "00000000-0000-4000-8000-000000000007", role: MANAGER }
          - { user: beta.manager2, external-id: "00000000-0000-4000-8000-000000000008", role: MANAGER }
  proxy:
    # Placeholder router range. The deploying organization sets its own Route/ingress peer pattern.
    pattern: 10\.128\.\d+\.\d+
  db:
    # Roles created by deploy/local/postgres/01-roles.sql. Locally the app still connects as the owner.
    app-user: trailkeep_app
    purge-user: trailkeep_purge
    import-user: trailkeep_import
  security:
    oidc:
      client-id: trailkeep
      client-secret: dev-only-client-secret # dev-only, matches the dev realm
    group-roles:
      trailkeep-compliance-admins: COMPLIANCE_ADMIN
      trailkeep-system-admins: SYSTEM_ADMIN
