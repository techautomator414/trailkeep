<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- Release a quarantined file without JavaScript, and after a refused reason (422), which keeps the text and shows the
     error summary that app.js focuses. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.release.title} + ' · ' + ${number} + ' · ' + ${@branding.name()}">Release</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.release.title}">Release a quarantined file</h1>
  <div th:if="${invalid}" class="alert alert-danger" role="alert" tabindex="-1" data-tk-error-summary
       aria-labelledby="tk-release-errors-title">
    <h2 id="tk-release-errors-title" class="h5" th:text="#{tk.release.errors}">The file was not released.</h2>
    <ul><li><a class="alert-link" th:href="'#reason-' + ${file.id}" th:text="#{tk.release.error}">Reason</a></li></ul>
  </div>
  <form th:replace="~{document/fragments/attachments :: release(${number}, ${file.id}, ${file.fileName}, ${reason},
                     ${invalid}, false)}"></form>
</main>
</body>
</html>
