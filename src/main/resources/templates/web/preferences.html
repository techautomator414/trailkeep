<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- The person's preferences (WP-27): the single-key shortcuts switch, a POST with CSRF back to this page. Without
     JavaScript the checkbox and button still work; the shortcuts themselves are app.js. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.prefs.title} + ' · ' + ${@branding.name()}">Preferences</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.prefs.title}">Preferences</h1>
  <p th:if="${param.saved != null}" class="alert alert-success" data-tk-toast th:text="#{tk.prefs.saved}">Saved.</p>
  <form method="post" th:action="@{/preferences}">
    <fieldset>
      <legend th:text="#{tk.prefs.keyboard}">Keyboard</legend>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="tk-pref-shortcuts" name="shortcuts" value="on"
               aria-describedby="tk-pref-shortcuts-hint" th:checked="${shortcuts}">
        <label class="form-check-label" for="tk-pref-shortcuts" th:text="#{tk.prefs.shortcuts}">Single-key shortcuts</label>
      </div>
      <p id="tk-pref-shortcuts-hint" class="form-text" th:text="#{tk.prefs.shortcuts.hint}">
        Press / to search and N for a new case, except while typing in a field or a dialog.</p>
    </fieldset>
    <button class="btn btn-primary" type="submit" th:text="#{tk.prefs.save}">Save preferences</button>
  </form>
</main>
</body>
</html>
