<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- The System screen (WP-25): scheduled jobs from JOB_RUN with their state in text (never colour alone), the
     outbox's backlog, and the virus scanner. Read-only; System Admins and Compliance Admins only. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.system.title} + ' · ' + ${@branding.name()}">System</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.system.title}">System</h1>
  <table class="table align-middle">
    <caption th:text="#{tk.system.jobs.caption}">Scheduled jobs, by name</caption>
    <thead><tr>
      <th scope="col" th:text="#{tk.system.job}">Job</th>
      <th scope="col" th:text="#{tk.system.last}">Last success on any replica</th>
      <th scope="col" th:text="#{tk.system.items}">Items</th>
      <th scope="col" th:text="#{tk.system.state}">State</th>
    </tr></thead>
    <tbody>
    <tr th:each="j : ${jobs}">
      <th scope="row" th:text="${#messages.msgOrNull('tk.system.job.' + j.job) ?: j.job}">SLA evaluator</th>
      <td><span th:if="${j.lastSuccess != null}" th:text="${#temporals.format(j.lastSuccess, 'yyyy-MM-dd HH:mm')}"
          >2026-11-11 09:15</span><span th:if="${j.lastSuccess == null}" th:text="#{tk.system.never}">Never</span></td>
      <td th:text="${j.lastSuccess != null} ? ${j.items} : '—'">12</td>
      <td th:text="#{'tk.system.state.' + ${j.state}}">On time</td>
    </tr>
    </tbody>
  </table>
  <h2 th:text="#{tk.system.outbox}">Outgoing mail</h2>
  <dl class="row">
    <dt class="col-sm-4" th:text="#{tk.system.outbox.pending}">Waiting to be sent</dt>
    <dd class="col-sm-8" th:text="${outbox.pending}">0</dd>
    <dt class="col-sm-4" th:text="#{tk.system.outbox.oldest}">Oldest waiting since</dt>
    <dd class="col-sm-8" th:text="${oldestPending != null} ? ${#temporals.format(oldestPending, 'yyyy-MM-dd HH:mm')}
        : #{tk.system.outbox.none}">Nothing is waiting</dd>
    <dt class="col-sm-4" th:text="#{tk.system.outbox.failed}">Failed for good</dt>
    <dd class="col-sm-8" th:text="${outbox.failed}">0</dd>
  </dl>
  <h2 th:text="#{tk.system.scanner}">Virus scanner</h2>
  <p th:text="#{'tk.system.scanner.' + ${scanner.state}}">clamd answers; uploads are scanned.</p>
  <p th:if="${scanner.version != null}" th:text="#{tk.system.scanner.version(${scanner.version})}">Version</p>
</main>
</body>
</html>
