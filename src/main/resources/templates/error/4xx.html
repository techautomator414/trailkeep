<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- Rendered by Spring Boot's error view resolver and by ErrorAdvice. Never shows exception details. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.problem.4xx.title} + ' · ' + ${@branding.name()}">Error</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.problem.4xx.title}">Error</h1>
  <p th:text="#{tk.problem.4xx.text}">Something went wrong.</p>
  <p><a th:href="@{/}" th:text="#{tk.problem.home}">Go to the dashboard</a></p>
</main>
</body>
</html>
