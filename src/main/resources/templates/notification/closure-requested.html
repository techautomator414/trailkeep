<!--/* SPDX-License-Identifier: Apache-2.0. HTML part of the closure-requested mail: simple, linear HTML with the same
     content as the text part (BUILD_PLAN §10.1), never the resolution summary or the follow-up actions. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="#{tk.mail.closure-requested.html.title(${caseNumber})}">Closure requested</title>
</head>
<body>
<p th:text="#{tk.mail.closure-requested.html.line(${requester},${caseNumber},${title},${outcome})}">tk.mail.closure-requested.html.line</p>
<p><a th:href="${link}" th:text="#{tk.mail.closure-requested.html.link(${caseNumber})}">Open the case</a></p>
<p th:text="#{tk.mail.closure-requested.footer}">tk.mail.closure-requested.footer</p>
</body>
</html>
