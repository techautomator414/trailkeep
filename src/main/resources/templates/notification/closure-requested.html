<!--/* SPDX-License-Identifier: Apache-2.0. HTML part of the closure-requested mail: simple, linear HTML with the same
     content as the text part (BUILD_PLAN §10.1), never the resolution summary or the follow-up actions. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="|Closure requested on ${caseNumber}|">Closure requested</title>
</head>
<body>
<p><span th:text="${requester}">Someone</span> asked you to approve closing case <span th:text="${caseNumber}">CASE</span>,
  &ldquo;<span th:text="${title}">title</span>&rdquo;, with the outcome &ldquo;<span th:text="${outcome}">outcome</span>&rdquo;.</p>
<p><a th:href="${link}" th:text="|Open ${caseNumber} to read the summary and decide|">Open the case</a></p>
<p>You receive this because you were chosen as the approver.</p>
</body>
</html>
