<!--/* SPDX-License-Identifier: Apache-2.0. HTML part of the comment-added mail: simple, linear HTML with the same
     content as the text part (BUILD_PLAN §10.1 "Documents the system produces"), never the comment text. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="|New comment on ${caseNumber}|">New comment</title>
</head>
<body>
<p><span th:text="${commenter}">Someone</span> commented on case <span th:text="${caseNumber}">CASE</span>,
  &ldquo;<span th:text="${title}">title</span>&rdquo;.</p>
<p><a th:href="${link}" th:text="|Open ${caseNumber} to read the comment|">Open the case</a></p>
<p>You receive this because you own the case.</p>
</body>
</html>
