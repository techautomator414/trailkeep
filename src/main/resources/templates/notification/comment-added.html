<!--/* SPDX-License-Identifier: Apache-2.0. HTML part of the comment-added mail: simple, linear HTML with the same
     content as the text part (BUILD_PLAN §10.1 "Documents the system produces"), never the comment text. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="#{tk.mail.comment-added.html.title(${caseNumber})}">New comment</title>
</head>
<body>
<p th:utext="#{tk.mail.comment-added.html.line(${#strings.escapeXml(commenter)},${#strings.escapeXml(caseNumber)},${#strings.escapeXml(title)})}">tk.mail.comment-added.html.line</p>
<p><a th:href="${link}" th:text="#{tk.mail.comment-added.html.link(${caseNumber})}">Open the case</a></p>
<p th:text="#{tk.mail.comment-added.footer}">tk.mail.comment-added.footer</p>
</body>
</html>
