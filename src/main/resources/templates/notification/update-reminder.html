<!--/* SPDX-License-Identifier: Apache-2.0. HTML part of the update-reminder mail: simple, linear HTML with the same
     content as the text part (BUILD_PLAN §10.1), never the request's message. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="|Reminder: update requested on ${caseNumber}|">Reminder</title>
</head>
<body>
<p>Reminder: <span th:text="${requester}">Someone</span> is still waiting for your update on case
  <span th:text="${caseNumber}">CASE</span>, &ldquo;<span th:text="${title}">title</span>&rdquo;.</p>
<p><a th:href="${link}" th:text="|Answer with a comment on ${caseNumber}|">Open the case</a></p>
<p>You receive this because an update was requested from you.</p>
</body>
</html>
