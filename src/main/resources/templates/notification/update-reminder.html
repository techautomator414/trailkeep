<!--/* SPDX-License-Identifier: Apache-2.0. HTML part of the update-reminder mail: simple, linear HTML with the same
     content as the text part (BUILD_PLAN §10.1), never the request's message. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="#{tk.mail.update-reminder.html.title(${caseNumber})}">Reminder</title>
</head>
<body>
<p th:text="#{tk.mail.update-reminder.html.line(${requester},${caseNumber},${title})}">tk.mail.update-reminder.html.line</p>
<p><a th:href="${link}" th:text="#{tk.mail.update-reminder.html.link(${caseNumber})}">Open the case</a></p>
<p th:text="#{tk.mail.update-reminder.footer}">tk.mail.update-reminder.footer</p>
</body>
</html>
