<!--/* SPDX-License-Identifier: Apache-2.0. HTML part of the case-reopened mail: simple, linear HTML with the same
     content as the text part (BUILD_PLAN §10.1), never the reason. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="#{tk.mail.case-reopened.html.title(${caseNumber})}">Case reopened</title>
</head>
<body>
<p th:text="#{tk.mail.case-reopened.html.line(${reopener},${caseNumber},${title})}">tk.mail.case-reopened.html.line</p>
<p><a th:href="${link}" th:text="#{tk.mail.case-reopened.html.link(${caseNumber})}">Open the case</a></p>
<p th:text="#{tk.mail.case-reopened.footer}">tk.mail.case-reopened.footer</p>
</body>
</html>
