<!--/* SPDX-License-Identifier: Apache-2.0. HTML part of the case-reopened mail: simple, linear HTML with the same
     content as the text part (BUILD_PLAN §10.1), never the reason. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="|${caseNumber} was reopened|">Case reopened</title>
</head>
<body>
<p><span th:text="${reopener}">Someone</span> reopened case <span th:text="${caseNumber}">CASE</span>,
  &ldquo;<span th:text="${title}">title</span>&rdquo;. Its SLA starts a new cycle today.</p>
<p><a th:href="${link}" th:text="|Open ${caseNumber} to read why|">Open the case</a></p>
<p>You receive this because you own the case or requested its closure.</p>
</body>
</html>
