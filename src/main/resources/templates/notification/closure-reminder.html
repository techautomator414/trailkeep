<!--/* SPDX-License-Identifier: Apache-2.0. HTML part of the closure-reminder mail: simple, linear HTML with the same
     content as the text part (BUILD_PLAN §10.1), never the resolution summary. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="#{tk.mail.closure-reminder.html.title(${caseNumber})}">Reminder</title>
</head>
<body>
<p th:utext="#{tk.mail.closure-reminder.html.line(${#strings.escapeXml(requester)},${#strings.escapeXml(caseNumber)},${#strings.escapeXml(title)},${#strings.escapeXml(outcome)})}">tk.mail.closure-reminder.html.line</p>
<p><a th:href="${link}" th:text="#{tk.mail.closure-reminder.html.link(${caseNumber})}">Open the case</a></p>
<p th:text="#{tk.mail.closure-reminder.footer}">tk.mail.closure-reminder.footer</p>
</body>
</html>
