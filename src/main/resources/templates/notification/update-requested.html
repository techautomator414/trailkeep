<!--/* SPDX-License-Identifier: Apache-2.0. HTML part of the update-requested mail: simple, linear HTML with the same
     content as the text part (BUILD_PLAN §10.1), never the request's message. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="#{tk.mail.update-requested.html.title(${caseNumber})}">Update requested</title>
</head>
<body>
<p th:utext="#{tk.mail.update-requested.html.line(${#strings.escapeXml(requester)},${#strings.escapeXml(caseNumber)},${#strings.escapeXml(title)})}">tk.mail.update-requested.html.line</p>
<p><a th:href="${link}" th:text="#{tk.mail.update-requested.html.link(${caseNumber})}">Open the case</a></p>
<p th:text="#{tk.mail.update-requested.footer}">tk.mail.update-requested.footer</p>
</body>
</html>
