     as the text part (BUILD_PLAN §10.1), never the description or the subject. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="#{tk.mail.sla-at-risk.html.title(${caseNumber})}">At risk</title>
</head>
<body>
<p th:text="#{tk.mail.sla-at-risk.html.line(${caseNumber},${title},${due})}">tk.mail.sla-at-risk.html.line</p>
<p><a th:href="${link}" th:text="#{tk.mail.sla-at-risk.html.link(${caseNumber})}">Open the case</a></p>
<p th:text="#{tk.mail.sla-at-risk.footer}">tk.mail.sla-at-risk.footer</p>
</body>
</html>
