     as the text part (BUILD_PLAN §10.1), never the description or the subject. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="#{tk.mail.sla-overdue.html.title(${caseNumber})}">Overdue</title>
</head>
<body>
<p th:utext="#{tk.mail.sla-overdue.html.line(${#strings.escapeXml(caseNumber)},${#strings.escapeXml(title)},${#strings.escapeXml(due)})}">tk.mail.sla-overdue.html.line</p>
<p><a th:href="${link}" th:text="#{tk.mail.sla-overdue.html.link(${caseNumber})}">Open the case</a></p>
<p th:text="#{tk.mail.sla-overdue.footer}">tk.mail.sla-overdue.footer</p>
</body>
</html>
