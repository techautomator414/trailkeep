<!--/* SPDX-License-Identifier: Apache-2.0. HTML part of the sla-overdue-repeat mail: simple, linear HTML with the same
     content as the text part (BUILD_PLAN §10.1), never the description or the subject. */-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="#{tk.mail.sla-overdue-repeat.html.title(${caseNumber})}">Still overdue</title>
</head>
<body>
<p th:text="#{tk.mail.sla-overdue-repeat.html.line(${caseNumber},${title},${due},${days})}">tk.mail.sla-overdue-repeat.html.line</p>
<p><a th:href="${link}" th:text="#{tk.mail.sla-overdue-repeat.html.link(${caseNumber})}">Open the case</a></p>
<p th:text="#{tk.mail.sla-overdue-repeat.footer}">tk.mail.sla-overdue-repeat.footer</p>
</body>
</html>
