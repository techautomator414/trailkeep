<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- The Import runs screen (WP-26 part s): every run, most recently requested first, 20 to a page with plain previous
     and next links; each row links to the run. System Admins and Compliance Admins only. "Request an import run"
     opens the request form in a native dialog (part s2), or as its own page without JavaScript. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.imports.title} + ' · ' + ${@branding.name()}">Import runs</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.imports.title}">Import runs</h1>
  <p><a th:href="@{/admin/system}" th:text="#{tk.system.title}">System</a></p>
  <p><a class="btn btn-primary" th:href="@{/admin/import-runs/new}" data-tk-dialog-open="tk-request-dialog"
        th:text="#{tk.imports.request}">Request an import run</a></p>
  <dialog id="tk-request-dialog" class="tk-dialog" aria-labelledby="tk-request-title">
    <h2 id="tk-request-title" th:text="#{tk.imports.request}">Request an import run</h2>
    <form th:replace="~{importer/fragments/request :: form('', false, true)}"></form>
  </dialog>
  <p th:if="${runs.total == 0}" th:text="#{tk.system.import.none}">No import has been run.</p>
  <p th:if="${runs.pages > 1}" th:text="#{tk.list.page(${runs.page},${runs.pages})}">Page 1 of 2.</p>
  <div th:unless="${runs.total == 0}" class="table-responsive">
    <table class="table">
      <caption th:text="#{tk.imports.caption}">Import runs, most recently requested first</caption>
      <thead>
      <tr>
        <th scope="col" th:text="#{tk.system.import.run}">Run</th>
        <th scope="col" th:text="#{tk.system.import.status}">Status</th>
        <th scope="col" th:text="#{tk.system.import.requested}">Requested</th>
        <th scope="col" th:text="#{tk.system.import.updated}">Last change</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="r : ${runs.rows}">
        <th scope="row"><a th:href="@{/admin/import-runs/{id}(id=${r.id})}" th:text="#{tk.system.import.run.value(
            ${r.id}, #{'tk.system.import.kind.' + ${r.kind}})}">12 (import)</a></th>
        <td th:text="#{'tk.system.import.status.' + ${r.status}}">Loaded</td>
        <td th:text="${#temporals.format(r.requested, 'yyyy-MM-dd HH:mm')}">2026-11-11 09:00</td>
        <td th:text="${#temporals.format(r.updated, 'yyyy-MM-dd HH:mm')}">2026-11-11 09:30</td>
      </tr>
      </tbody>
    </table>
  </div>
  <nav th:if="${runs.pages > 1}" th:aria-label="#{tk.list.pages}">
    <ul class="pagination">
      <li class="page-item" th:if="${runs.page > 1}">
        <a class="page-link" rel="prev" th:href="@{/admin/import-runs(page=${runs.page - 1})}"
           th:text="#{tk.list.previous}">Previous page</a></li>
      <li class="page-item" th:if="${runs.page < runs.pages}">
        <a class="page-link" rel="next" th:href="@{/admin/import-runs(page=${runs.page + 1})}"
           th:text="#{tk.list.next}">Next page</a></li>
    </ul>
  </nav>
</main>
</body>
</html>
