<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- The run request (WP-26 part s2, design §3 step 0) as a page: what "Request an import run" opens without
     JavaScript, and what a refused request re-renders (422, the source id marked and summarized). -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.imports.request} + ' · ' + ${@branding.name()}">Request an import run</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.imports.request}">Request an import run</h1>
  <div th:if="${invalid}" class="alert alert-danger" role="alert" tabindex="-1" data-tk-error-summary
       th:text="#{tk.imports.request.invalid}">Not requested: the source id is 1 to 16 lowercase letters, digits or
    hyphens.</div>
  <form th:replace="~{importer/fragments/request :: form(${sourceId}, ${invalid}, false)}"></form>
</main>
</body>
</html>
