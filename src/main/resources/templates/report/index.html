<!DOCTYPE html>

<!-- The reports (BUILD_PLAN §4.5, WP-22): a list of the two, each a link. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.report.title} + ' · ' + ${@branding.name()}">Reports</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.report.title}">Reports</h1>
  <ul>
    <li><a th:href="@{/reports/aging}" th:text="#{tk.report.aging}">Aging</a>:
      <span th:text="#{tk.report.aging.about}">Open cases by age and SLA state.</span></li>
    <li><a th:href="@{/reports/compliance}" th:text="#{tk.report.compliance}">SLA compliance</a>:
      <span th:text="#{tk.report.compliance.about}">Cases closed in a period, within the SLA or not.</span></li>
  </ul>
</main>
</body>
</html>
