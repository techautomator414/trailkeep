<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- The aging report (BUILD_PLAN §4.5, WP-22): open and pending-closure cases the person reads, by team and case type,
     counted by days since the matter was identified and by SLA state, with a total row. A real table with a caption,
     column and row headers; counts only, never case text (§3.3). Printable as is (app.css @media print). -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.report.aging} + ' · ' + ${@branding.name()}">Aging</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.report.aging}">Aging</h1>
  <p th:text="#{tk.report.aging.asOf(${r.asOf})}">Open cases as of 2026-11-07.</p>
  <p th:if="${r.lines.isEmpty()}" th:text="#{tk.report.none}">No case to report.</p>
  <div class="table-responsive" th:unless="${r.lines.isEmpty()}">
    <table class="table table-sm tk-report">
      <caption th:text="#{tk.report.aging.caption(${r.asOf})}">Open cases by age and SLA state</caption>
      <thead>
      <tr>
        <th scope="col" th:text="#{tk.case.team}">Team</th>
        <th scope="col" th:text="#{tk.case.type}">Case type</th>
        <th scope="col" th:each="c : ${ {'upTo30','upTo60','upTo90','over90','onTrack','atRisk','overdue','noSla'} }"
            th:text="#{'tk.report.aging.' + ${c}}">0–30 days</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="l : ${r.lines}" th:with="c=${l.counts}">
        <th scope="row" th:text="${l.team}">Team</th>
        <td th:text="${c.caseType}">Type</td>
        <td th:text="${c.upTo30}">1</td><td th:text="${c.upTo60}">0</td><td th:text="${c.upTo90}">0</td>
        <td th:text="${c.over90}">0</td><td th:text="${c.onTrack}">1</td><td th:text="${c.atRisk}">0</td>
        <td th:text="${c.overdue}">0</td><td th:text="${c.noSla}">0</td>
      </tr>
      </tbody>
      <tfoot>
      <tr th:with="c=${r.total}">
        <th scope="row" colspan="2" th:text="#{tk.report.total}">Total</th>
        <td th:text="${c.upTo30}">1</td><td th:text="${c.upTo60}">0</td><td th:text="${c.upTo90}">0</td>
        <td th:text="${c.over90}">0</td><td th:text="${c.onTrack}">1</td><td th:text="${c.atRisk}">0</td>
        <td th:text="${c.overdue}">0</td><td th:text="${c.noSla}">0</td>
      </tr>
      </tfoot>
    </table>
  </div>
</main>
</body>
</html>
