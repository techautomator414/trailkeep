<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- One team's weekly aging report (WP-23 part b2), saved against the version the form was loaded with. On a 409 the
     input stays, the conflict panel says why and Reload is the only way on; it takes focus like an error summary. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.schedules.edit(${s.team})} + ' · ' + ${@branding.name()}">Aging report schedule</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.schedules.edit(${s.team})}">Aging report for Team</h1>
  <p><a th:href="@{/admin/report-schedules}" th:text="#{tk.schedules.all}">All report schedules</a></p>
  <div th:if="${conflict}" class="alert alert-warning" role="alert" tabindex="-1" data-tk-error-summary
       aria-labelledby="tk-conflict-title">
    <h2 id="tk-conflict-title" class="h5" th:text="#{tk.schedules.conflict}">This schedule changed meanwhile</h2>
    <p th:text="#{tk.schedules.conflict.text}">Your changes were not saved. They are still shown below.</p>
    <p><a class="btn btn-primary" th:href="@{/admin/report-schedules/{t}(t=${s.teamId})}" th:text="#{tk.edit.reload}">
      Reload</a></p>
  </div>
  <div th:if="${invalid}" class="alert alert-danger" role="alert" tabindex="-1" data-tk-error-summary
       th:text="#{tk.schedules.invalid}">Not saved: choose a day and an hour from the lists.</div>
  <form method="post" th:action="@{/admin/report-schedules/{t}(t=${s.teamId})}">
    <input type="hidden" name="version" th:value="${values.version}">
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="enabled" name="enabled" value="true"
             th:checked="${values.enabled}">
      <label class="form-check-label" for="enabled" th:text="#{tk.schedules.enabled}">Send the weekly report</label>
    </div>
    <label class="form-label" for="weekday" th:text="#{tk.schedules.weekday}">Day</label>
    <select class="form-select mb-3" id="weekday" name="weekday">
      <option th:each="d : ${days}" th:value="${d}" th:selected="${values.weekday == d}"
              th:text="#{'tk.schedules.day.' + ${d}}">Monday</option>
    </select>
    <label class="form-label" for="hour" th:text="#{tk.schedules.hour(${zone})}">Hour</label>
    <select class="form-select mb-3" id="hour" name="hour" aria-describedby="tk-hour-hint">
      <option th:each="h : ${#numbers.sequence(0, 23)}" th:value="${h}" th:selected="${values.hour == h}"
              th:text="${#numbers.formatInteger(h, 2)} + ':00'">06:00</option>
    </select>
    <p class="form-text" id="tk-hour-hint" th:text="#{tk.schedules.hint}">Saving sets the next run from now.</p>
    <div class="tk-dialog-actions">
      <button th:unless="${conflict}" class="btn btn-primary" type="submit" th:text="#{tk.schedules.save}">Save
        schedule</button>
      <a class="btn btn-outline-secondary" th:href="@{/admin/report-schedules}" th:text="#{tk.edit.cancel}">Cancel</a>
    </div>
  </form>
</main>
</body>
</html>
