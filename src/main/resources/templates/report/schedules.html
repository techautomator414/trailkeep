<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- The report schedules (WP-23 part b2), Compliance Admins only: every team with its weekly aging report, each team
     linking to its form. Status is text, never colour alone. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.schedules.title} + ' · ' + ${@branding.name()}">Report schedules</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.schedules.title}">Report schedules</h1>
  <p th:replace="~{report/schedules :: admin}"></p>
  <p th:text="#{tk.schedules.intro(${zone})}">Each team's aging report goes out weekly.</p>
  <table class="table">
    <caption th:text="#{tk.schedules.caption}">The weekly aging report of every team</caption>
    <thead><tr><th scope="col" th:text="#{tk.case.team}">Team</th>
      <th scope="col" th:text="#{tk.schedules.status}">Status</th>
      <th scope="col" th:text="#{tk.schedules.when}">Goes out</th>
      <th scope="col" th:text="#{tk.schedules.next}">Next</th></tr></thead>
    <tbody>
    <tr th:each="s : ${schedules}">
      <th scope="row"><a th:href="@{/admin/report-schedules/{t}(t=${s.teamId})}" th:text="${s.team}">Team</a></th>
      <td th:text="${!s.scheduled} ? #{tk.schedules.none} : (${s.enabled} ? #{tk.schedules.on} : #{tk.schedules.off})">
        Enabled</td>
      <td th:text="${s.scheduled} ? #{tk.schedules.at(${#messages.msg('tk.schedules.day.' + s.weekday)},
          ${#numbers.formatInteger(s.hour, 2)})} : '—'">Mondays at 06:00</td>
      <td th:text="${s.nextRun} ? ${#temporals.format(s.nextRun, 'yyyy-MM-dd HH:mm')} : '—'">2026-11-09 06:00</td>
    </tr>
    <tr th:if="${#lists.isEmpty(schedules)}"><td colspan="4" th:text="#{tk.schedules.noteams}">No teams yet.</td></tr>
    </tbody>
  </table>
</main>
<!-- The Compliance Admin's screens, linked from each of them. -->
<p th:fragment="admin"><a th:href="@{/admin/sla-policies}" th:text="#{tk.sla.title}">SLA policies</a>
  <a class="ms-3" th:href="@{/admin/case-types}" th:text="#{tk.types.title}">Case types</a>
  <a class="ms-3" th:href="@{/admin/report-schedules}" th:text="#{tk.schedules.title}">Report schedules</a>
  <a class="ms-3" th:href="@{/reports/runs}" th:text="#{tk.runs.title}">Scheduled reports</a></p>
</body>
</html>
