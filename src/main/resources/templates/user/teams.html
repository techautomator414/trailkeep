<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teams – Administration – Trailkeep</title>
</head>
<body>
<a href="#main">Skip to main content</a>
<main id="main" tabindex="-1">
  <h1>Teams</h1>
  <p th:if="${invalid}" role="alert">The team was not created: a team name has 1 to 120 characters.</p>
  <table>
    <caption>All teams</caption>
    <thead><tr><th scope="col">Name</th><th scope="col">Status</th></tr></thead>
    <tbody>
    <tr th:each="t : ${teams}">
      <th scope="row"><a th:href="@{/admin/teams/{id}(id=${t.id})}" th:text="${t.name}">Team</a></th>
      <td th:text="${t.active} ? 'Active' : 'Inactive'">Active</td>
    </tr>
    <tr th:if="${#lists.isEmpty(teams)}"><td colspan="2">No teams yet.</td></tr>
    </tbody>
  </table>
  <h2>Create a team</h2>
  <form method="post" th:action="@{/admin/teams}">
    <label for="name">Team name</label>
    <input id="name" name="name" type="text" required maxlength="120" autocomplete="off">
    <input type="hidden" name="active" value="true">
    <button type="submit">Create team</button>
  </form>
</main>
</body>
</html>
