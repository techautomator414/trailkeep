<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.users.title} + ' · ' + ${@branding.name()}">Users</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <p><a th:href="@{/admin/teams}" th:text="#{tk.teams.title}">Teams</a>
    <a class="ms-3" th:href="@{/admin/system}" th:text="#{tk.system.title}">System</a></p>
  <h1 th:text="#{tk.users.title}">Users</h1>
  <p th:text="#{tk.users.hint}">Disabling a user signs them out everywhere at once.</p>
  <table class="table">
    <caption th:text="#{tk.users.caption}">All users</caption>
    <thead><tr><th scope="col" th:text="#{tk.users.name}">Name</th>
      <th scope="col" th:text="#{tk.users.status}">Status</th>
      <th scope="col" th:text="#{tk.team.action}">Action</th></tr></thead>
    <tbody>
    <tr th:each="u : ${users}">
      <th scope="row" th:text="${u.displayName}">Name</th>
      <td th:text="${u.disabled} ? #{tk.users.disabled} : #{tk.users.enabled}">Enabled</td>
      <td>
        <form th:if="${u.disabled}" method="post" th:action="@{/admin/users/{id}/enable(id=${u.userId})}">
          <button class="btn btn-outline-primary btn-sm" type="submit"
                  th:text="#{tk.users.enable(${u.displayName})}">Enable</button>
        </form>
        <form th:unless="${u.disabled or u.userId == self}" method="post"
              th:action="@{/admin/users/{id}/disable(id=${u.userId})}">
          <button class="btn btn-outline-danger btn-sm" type="submit"
                  th:text="#{tk.users.disable(${u.displayName})}">Disable</button>
        </form>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(users)}"><td colspan="3" th:text="#{tk.users.none}">No users yet.</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
