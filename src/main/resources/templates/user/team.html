<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="${team.name} + ' · ' + #{tk.teams.title} + ' · ' + ${@branding.name()}">Team</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <p><a th:href="@{/admin/teams}" th:text="#{tk.teams.all}">All teams</a></p>
  <h1 th:text="${team.name}">Team</h1>
  <p th:if="${invalid}" class="alert alert-danger" role="alert" th:text="#{tk.team.invalid}">Nothing changed.</p>

  <h2 th:text="#{tk.team.details}">Team details</h2>
  <form method="post" th:action="@{/admin/teams/{id}(id=${team.id})}">
    <label class="form-label" for="name" th:text="#{tk.teams.name}">Team name</label>
    <input class="form-control" id="name" name="name" type="text" required maxlength="120" th:value="${team.name}">
    <div class="form-check mt-2">
      <input type="hidden" name="_active" value="on">
      <input class="form-check-input" id="active" name="active" type="checkbox" value="true"
             th:checked="${team.active}">
      <label class="form-check-label" for="active" th:text="#{tk.team.active}">Active</label>
    </div>
    <button class="btn btn-primary mt-2" type="submit" th:text="#{tk.team.save}">Save team</button>
  </form>

  <h2 th:text="#{tk.team.members}">Members</h2>
  <table class="table">
    <caption th:text="#{tk.team.members.caption(${team.name})}">Members</caption>
    <thead><tr><th scope="col" th:text="#{tk.team.member}">Name</th><th scope="col" th:text="#{tk.team.role}">Role</th>
      <th scope="col" th:text="#{tk.team.action}">Action</th></tr></thead>
    <tbody>
    <tr th:each="m : ${members}">
      <th scope="row" th:text="${m.disabled} ? #{tk.team.member.disabled(${m.displayName})} : ${m.displayName}">Name</th>
      <td th:text="#{'tk.role.' + ${m.role}}">Reader</td>
      <td>
        <form method="post" th:action="@{/admin/teams/{t}/members/{u}/remove(t=${team.id},u=${m.userId})}">
          <button class="btn btn-outline-danger btn-sm" type="submit"
                  th:text="#{tk.team.remove(${m.displayName})}">Remove</button>
        </form>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(members)}"><td colspan="3" th:text="#{tk.team.members.none}">No members yet.</td></tr>
    </tbody>
  </table>

  <h2 th:text="#{tk.team.grant}">Grant or change a role</h2>
  <p th:text="#{tk.team.grant.hint}">System Admins are not listed.</p>
  <form method="post" th:action="@{/admin/teams/{id}/members(id=${team.id})}">
    <label class="form-label" for="userId" th:text="#{tk.team.user}">User</label>
    <select class="form-select" id="userId" name="userId" required>
      <option value="" th:text="#{tk.team.user.choose}">Choose a user</option>
      <option th:each="u : ${users}" th:value="${u.userId}" th:text="${u.displayName}">User</option>
    </select>
    <label class="form-label mt-2" for="role" th:text="#{tk.team.role}">Role</label>
    <select class="form-select" id="role" name="role" required>
      <option th:each="r : ${roles}" th:value="${r}" th:text="#{'tk.role.' + ${r}}">Reader</option>
    </select>
    <button class="btn btn-primary mt-2" type="submit" th:text="#{tk.team.grant.submit}">Save role</button>
  </form>
</main>
</body>
</html>
