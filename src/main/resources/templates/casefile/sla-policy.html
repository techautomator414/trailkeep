<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="${policy.values.name} + ' · ' + #{tk.sla.title} + ' · ' + ${@branding.name()}">Trailkeep</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <p><a th:href="@{/admin/sla-policies}" th:text="#{tk.sla.all}">All SLA policies</a></p>
  <h1 th:text="${policy.values.name}">Policy</h1>
  <p th:if="${invalid}" class="alert alert-danger" role="alert" th:text="${nameTaken} ? #{tk.config.name.taken.banner} : #{tk.config.unchanged}">Nothing changed.</p>
  <form th:replace="~{casefile/fragments/sla-policy-form :: form(@{/admin/sla-policies/{id}(id=${policy.id})},
        ${policy.values}, #{tk.sla.save})}"></form>
</main>
</body>
</html>
