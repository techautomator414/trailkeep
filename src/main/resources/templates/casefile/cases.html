<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- The cases list (BUILD_PLAN §4.4). The filter form and the sort and page links are plain GETs that work without
     JavaScript; with htmx they replace only #tk-case-results and push the URL, and the fragment says where focus goes
     and what the live region announces. Filter drawer, saved views and CSV arrive in WP-15 parts 2 to 4. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.list.title} + ' · ' + ${@branding.name()}">Cases</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.list.title}">Cases</h1>
  <form id="tk-case-filter" class="row g-3 align-items-end" method="get" role="search" th:action="@{/cases}"
        th:aria-label="#{tk.list.filter}" th:attr="hx-get=@{/cases}" hx-target="#tk-case-results"
        hx-push-url="true">
    <div class="col-12 col-lg-4">
      <label class="form-label" for="tk-q" th:text="#{tk.list.q}">Search</label>
      <input id="tk-q" class="form-control" type="search" name="q" th:value="${query.filter.text}"
             th:maxlength="${maxText}" aria-describedby="tk-q-hint">
      <p id="tk-q-hint" class="form-text mb-0" th:text="#{tk.list.q.hint}">Every word must appear.</p>
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label" for="tk-status" th:text="#{tk.list.status}">Status</label>
      <select id="tk-status" class="form-select" name="status">
        <option value="" th:text="#{tk.list.status.any}">Any but archived</option>
        <option th:each="s : ${statuses}" th:value="${s}" th:selected="${query.filter.statuses.contains(s)}"
                th:text="#{'tk.case.status.' + ${s}}">Open</option>
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label" for="tk-type" th:text="#{tk.case.type}">Case type</label>
      <select id="tk-type" class="form-select" name="type">
        <option value="" th:text="#{tk.list.any}">Any</option>
        <option th:each="o : ${list.caseTypes}" th:value="${o.id}" th:selected="${query.filter.caseTypeId == o.id}"
                th:text="${o.name}">Type</option>
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label" for="tk-team" th:text="#{tk.case.team}">Team</label>
      <select id="tk-team" class="form-select" name="team">
        <option value="" th:text="#{tk.list.any}">Any</option>
        <option th:each="o : ${list.teams}" th:value="${o.id}" th:selected="${query.filter.teamId == o.id}"
                th:text="${o.name}">Team</option>
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label" for="tk-owner" th:text="#{tk.case.owner}">Owner</label>
      <select id="tk-owner" class="form-select" name="owner">
        <option value="" th:text="#{tk.list.owner.anyone}">Anyone</option>
        <option value="me" th:selected="${query.filter.mine}" th:text="#{tk.list.owner.me}">Me</option>
        <option th:each="o : ${list.owners}" th:value="${o.id}" th:selected="${query.filter.ownerId == o.id}"
                th:text="${o.name}">Owner</option>
      </select>
    </div>
    <input type="hidden" name="sort" th:value="${#strings.toLowerCase(query.sort)}">
    <input type="hidden" name="dir" th:value="${query.descending ? 'desc' : 'asc'}">
    <div class="col-12">
      <button class="btn btn-primary" type="submit" th:text="#{tk.list.apply}">Apply</button>
    </div>
  </form>
  <div id="tk-case-results" class="mt-4" th:insert="~{casefile/fragments/case-results :: results}"></div>
</main>
</body>
</html>
