<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- The cases list (BUILD_PLAN §4.4). Sort headers and page links are plain GETs that work without JavaScript; with
     htmx they replace only #tk-case-results and push the URL, and the fragment says where focus goes and what the
     live region announces. Filters and search arrive in WP-15 part 1b; drawer, saved views and CSV in parts 2 to 4. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.list.title} + ' · ' + ${@branding.name()}">Cases</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.list.title}">Cases</h1>
  <div id="tk-case-results" th:insert="~{casefile/fragments/case-results :: results}"></div>
</main>
</body>
</html>
