<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- Request closure without JavaScript, and after a refused request (BUILD_PLAN §4.3): 422 with each wrong field
     summarized and linked, 409 when the case moved on, with Reload. The summary takes focus (app.js). -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.closure.title(${number})} + ' · ' + ${@branding.name()}">Request closure</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.closure.title(${number})}">Request closure of CASE-2026-000001</h1>
  <div th:unless="${#lists.isEmpty(closureErrors)}" class="alert alert-danger" role="alert" tabindex="-1"
       data-tk-error-summary aria-labelledby="tk-closure-errors">
    <h2 id="tk-closure-errors" class="h5" th:text="#{tk.closure.errors}">Closure was not requested.</h2>
    <ul><li th:each="e : ${closureErrors}"><a class="alert-link"
        th:href="${e == 'outcome'} ? '#tk-outcome' : (${e == 'summary'} ? '#tk-summary'
                 : (${e == 'followUps'} ? '#tk-follow-ups' : '#tk-approver'))"
        th:text="#{'tk.closure.error.' + ${e}}">Field</a></li></ul>
  </div>
  <div th:if="${conflict}" class="alert alert-warning" role="alert" tabindex="-1" data-tk-error-summary
       aria-labelledby="tk-closure-conflict">
    <h2 id="tk-closure-conflict" class="h5" th:text="#{tk.closure.conflict}">This case changed.</h2>
    <p><a class="btn btn-primary" th:href="@{/cases/{n}(n=${number})}" th:text="#{tk.edit.reload}">Reload</a></p>
  </div>
  <form th:replace="~{casefile/fragments/closure-request :: form(${number}, ${choices}, ${form}, ${closureErrors},
                     false)}"></form>
</main>
</body>
</html>
