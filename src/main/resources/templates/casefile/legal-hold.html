<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- Place or lift a legal hold without JavaScript and after a refused post (WP-24 part b): 422 with the reason
     summarized and linked, 409 with Reload when someone else changed the hold meanwhile. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="(${hold} ? #{tk.hold.title.place(${number})} : #{tk.hold.title.lift(${number})}) + ' · '
                      + ${@branding.name()}">Legal hold</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="${hold} ? #{tk.hold.title.place(${number})} : #{tk.hold.title.lift(${number})}">Legal hold</h1>
  <div th:if="${holdInvalid}" class="alert alert-danger" role="alert" tabindex="-1" data-tk-error-summary
       aria-labelledby="tk-hold-errors">
    <h2 id="tk-hold-errors" class="h5" th:text="#{tk.hold.errors}">The legal hold was not changed.</h2>
    <ul><li><a class="alert-link" href="#tk-hold-reason" th:text="#{tk.hold.error.reason}">Reason</a></li></ul>
  </div>
  <div th:if="${conflict}" class="alert alert-warning" role="alert" tabindex="-1" data-tk-error-summary
       aria-labelledby="tk-hold-conflict">
    <h2 id="tk-hold-conflict" class="h5" th:text="#{tk.hold.conflict}">The legal hold changed meanwhile.</h2>
    <p><a class="btn btn-primary" th:href="@{/cases/{n}(n=${number})}" th:text="#{tk.edit.reload}">Reload</a></p>
  </div>
  <th:block th:unless="${conflict}">
    <form th:replace="~{casefile/fragments/legal-hold :: form(${number}, ${hold}, ${reason}, ${holdInvalid}, false)}">
    </form>
  </th:block>
</main>
</body>
</html>
