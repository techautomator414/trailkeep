<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- Mark restricted / Mark standard without JavaScript, and after a stale save (409), which offers only Reload. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{${'tk.sensitivity.title.' + target}(${confirm.number})} + ' · ' + ${@branding.name()}">
  Mark restricted</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{${'tk.sensitivity.title.' + target}(${confirm.number})}">Mark CASE-2026-000001 restricted</h1>
  <p th:text="${confirm.title}">Title</p>
  <div th:if="${conflict}" class="alert alert-warning" role="alert" tabindex="-1" data-tk-error-summary
       aria-labelledby="tk-conflict-title">
    <h2 id="tk-conflict-title" class="h5" th:text="#{tk.sensitivity.conflict}">This case changed.</h2>
    <p><a class="btn btn-primary" th:href="@{/cases/{n}(n=${confirm.number})}" th:text="#{tk.edit.reload}">
      Reload</a></p>
  </div>
  <th:block th:unless="${conflict}">
    <form th:replace="~{casefile/fragments/case-actions :: sensitivity(${confirm.number}, ${confirm.version}, ${target}, false)}"></form>
  </th:block>
</main>
</body>
</html>
