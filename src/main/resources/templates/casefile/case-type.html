<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="${caseType.values.name} + ' · ' + #{tk.types.title} + ' · ' + ${@branding.name()}">Trailkeep</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <p><a th:href="@{/admin/case-types}" th:text="#{tk.types.all}">All case types</a></p>
  <h1 th:text="${caseType.values.name}">Type</h1>
  <p th:if="${invalid}" class="alert alert-danger" role="alert" th:text="#{tk.config.unchanged}">Nothing changed.</p>
  <form th:replace="~{casefile/fragments/case-type-form :: form(@{/admin/case-types/{id}(id=${caseType.id})},
        ${caseType.values}, #{tk.types.save})}"></form>
</main>
</body>
</html>
