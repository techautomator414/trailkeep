<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- Reject or request changes without JavaScript and after a refused post (BUILD_PLAN §4.3, WP-19 part c2): the
     request it decides, then the form; 422 with each wrong field summarized and linked, 409 with Reload when a
     concurrent decision got there first. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.decision.title(${number})} + ' · ' + ${@branding.name()}">Decide</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.decision.title(${number})}">Reject or request changes</h1>
  <div th:unless="${#lists.isEmpty(decisionErrors)}" class="alert alert-danger" role="alert" tabindex="-1"
       data-tk-error-summary aria-labelledby="tk-decision-errors">
    <h2 id="tk-decision-errors" class="h5" th:text="#{tk.decision.errors}">The closure was not decided.</h2>
    <ul><li th:each="e : ${decisionErrors}"><a class="alert-link"
        th:href="${e == 'decision'} ? '#tk-decision-REJECTED' : '#tk-reason'"
        th:text="#{'tk.decision.error.' + ${e}}">Field</a></li></ul>
  </div>
  <div th:if="${conflict}" class="alert alert-warning" role="alert" tabindex="-1" data-tk-error-summary
       aria-labelledby="tk-decision-conflict">
    <h2 id="tk-decision-conflict" class="h5" th:text="#{tk.decision.conflict}">This request was decided.</h2>
    <p><a class="btn btn-primary" th:href="@{/cases/{n}(n=${number})}" th:text="#{tk.edit.reload}">Reload</a></p>
  </div>
  <section class="mb-3" aria-labelledby="tk-decision-request">
    <h2 id="tk-decision-request" class="h5" th:text="#{tk.closure.pending}">Pending closure</h2>
    <p th:text="#{tk.closure.pending.text(${pending.requestedBy},
                  ${#temporals.format(pending.requestedAt, 'yyyy-MM-dd HH:mm')}, ${pending.approver},
                  ${pending.outcome})}">Requested by X.</p>
    <th:block th:replace="~{casefile/fragments/closure-decision :: fields(${pending.summary}, ${pending.followUps})}"/>
  </section>
  <form th:replace="~{casefile/fragments/closure-decision :: decide(${number}, ${pending.id}, ${decisionForm},
                     ${decisionErrors}, false)}"></form>
</main>
</body>
</html>
