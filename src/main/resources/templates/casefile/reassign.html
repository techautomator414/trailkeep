<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- Reassign without JavaScript, and after a refused save (BUILD_PLAN §4.3): 422 for an owner who does not work in
     the chosen team, 409 when the case changed since the form was loaded, with Reload. The alert takes focus. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{web/layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{tk.assign.title(${reassign.number})} + ' · ' + ${@branding.name()}">Reassign</title></head>
<body>
<main id="main" class="container tk-main" tabindex="-1">
  <h1 th:text="#{tk.assign.title(${reassign.number})}">Reassign CASE-2026-000001</h1>
  <p th:text="${reassign.title}">Title</p>
  <div th:if="${invalid}" class="alert alert-danger" role="alert" tabindex="-1" data-tk-error-summary
       aria-labelledby="tk-errors-title">
    <h2 id="tk-errors-title" class="h5" th:text="#{tk.assign.errors}">The case was not reassigned.</h2>
    <ul><li><a class="alert-link" href="#ownerId" th:text="#{tk.assign.error}">Owner</a></li></ul>
  </div>
  <div th:if="${conflict}" class="alert alert-warning" role="alert" tabindex="-1" data-tk-error-summary
       aria-labelledby="tk-conflict-title">
    <h2 id="tk-conflict-title" class="h5" th:text="#{tk.assign.conflict}">This case changed.</h2>
    <p><a class="btn btn-primary" th:href="@{/cases/{n}/reassign(n=${reassign.number})}"
          th:text="#{tk.edit.reload}">Reload</a></p>
  </div>
  <th:block th:unless="${conflict}">
    <form th:replace="~{casefile/fragments/case-actions :: reassign(${reassign}, ${teamId}, ${ownerId}, ${invalid}, false)}"></form>
  </th:block>
</main>
</body>
</html>
