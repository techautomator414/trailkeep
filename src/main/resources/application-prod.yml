#
# Production profile. Required values come from the environment (ConfigMap) and from mounted secret files
# (spring.config.import=configtree:...), never from this file:
#   - app.proxy.pattern has no default, so startup fails until the deploying organization sets it.
#   - app.security.oidc.issuer-uri, client-id and client-secret (a secret file) have no default either; the
#     provider is found by issuer discovery at startup.
#   - app.base-url, app.mail.from and spring.mail.host have no default: no mail is sent from, or links to, a guess.
#   - spring.jpa.hibernate.ddl-auto is deliberately absent; the persistence PR owns JPA settings and prod runs
#     "validate" only.
# Logging: this profile switches logback-spring.xml to one JSON object per line.
server:
  # The root filesystem is read-only; these paths are emptyDir mounts in deploy/base/deployment.yaml.
  tomcat:
    basedir: /var/lib/trailkeep/tomcat
spring:
  # The runtime user owns no table and has no DDL rights (BUILD_PLAN section 8 rule 7), so no prod process migrates:
  # Flyway runs only in the migration Job (profile migrate, deploy/jobs/migrate), as the schema owner, before the
  # rollout. Hibernate still validates the schema at start-up (ddl-auto: validate in application.yml). Flyway's own
  # validation (checksums, pending migrations) is not weakened, it runs in that Job on every migrate
  # (validate-on-migrate: true); the application does not read Flyway's history table, which the app user has no
  # grant on.
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        provider:
          idp:
            issuer-uri: ${app.security.oidc.issuer-uri}
  servlet:
    multipart:
      location: /var/lib/trailkeep/uploads
  # app -> SMTP needs STARTTLS (BUILD_PLAN §9 Transport): a relay that does not offer it is refused, never used in
  # the clear. spring.mail.host/port come from the ConfigMap, username/password (if any) from secret files.
  mail:
    properties:
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
app:
  attachments:
    # The same emptyDir: an upload is copied here while it is checked and scanned, then deleted.
    temp-dir: /var/lib/trailkeep/uploads
