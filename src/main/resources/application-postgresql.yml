# Database vendor profile: PostgreSQL. Activated through the profile groups in application.yml.
app:
  db:
    vendor: postgresql

spring:
  flyway:
    # BUILD_PLAN Appendix A, PostgreSQL column.
    placeholders:
      id: BIGINT
      int: INTEGER
      bool: BOOLEAN
      "true": "TRUE"
      "false": "FALSE"
      clob: TEXT
      bytes: BYTEA
      tstz: TIMESTAMP WITH TIME ZONE
      # UTC database time without a zone, for ShedLock's SHEDLOCK table only (its documented PostgreSQL type).
      ts: TIMESTAMP
  jpa:
    properties:
      # Fix the dialect version (ADR-0004). These OVERRIDE the product name and version Hibernate detects from
      # the connection; they do not skip detection (that would need hibernate.boot.allow_jdbc_metadata_access=false).
      # The point is that DDL expectations do not change with whichever server version the app connects to.
      jakarta:
        persistence:
          database-product-name: PostgreSQL
          database-major-version: 16
          database-minor-version: 0
