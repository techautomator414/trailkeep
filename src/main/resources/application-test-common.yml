#
# Settings shared by every Testcontainers profile. The profile groups in application.yml pull this file into both
# 'test' (PostgreSQL) and 'oracle-test' (Oracle), so a value that a Spring context needs in order to start is set
# once, here, and the two vendors cannot drift apart again (the first main run after PR 8 failed on Oracle because the
# OIDC client registration existed only in application-test.yml).
#
# The grantees below are created before migration by the test-only TestDatabaseUsers Flyway callback;
# DatabaseGrantsIT logs in as each of them.
app:
  base-url: https://trailkeep.example.invalid
  mail:
    from: Trailkeep (test) <trailkeep@example.invalid>
    # No scheduled dispatch in tests, so they stay deterministic; dispatcher tests call OutboxDispatcher.dispatch().
    dispatch-cron: "-"
  sla:
    # Likewise no scheduled SLA evaluation; evaluator tests call SlaEvaluator.evaluate(now).
    evaluate-cron: "-"
  reminders:
    # Likewise; reminder tests call RemindersTick.run(now).
    cron: "-"
  reports:
    # Likewise; delivery tests call ReportDeliveryTick.run(now).
    delivery-cron: "-"
  retention:
    # Likewise; archive tests call ArchiveJob.run(now).
    archive-cron: "-"
  attachments:
    clamd:
      # Unreachable on purpose, like the provider endpoints below: scanner tests start their own clamd (fake or real).
      host: 127.0.0.1
      port: 9
  proxy:
    # Placeholder router range. Loopback (the test client) is deliberately outside it.
    pattern: 10\.128\.\d+\.\d+
  db:
    app-user: trailkeep_app
    purge-user: trailkeep_purge
    import-user: trailkeep_import
  security:
    oidc:
      client-id: trailkeep
      client-secret: dev-only-client-secret # dev-only, matches the dev realm KeycloakLoginIT imports
    group-roles:
      trailkeep-compliance-admins: COMPLIANCE_ADMIN
      trailkeep-system-admins: SYSTEM_ADMIN

spring:
  ssl:
    bundle:
      jks:
        # The clamd TLS bundle (ADR-0012) must exist for contexts to start; nothing in these contexts scans. The JDK's
        # own public CA store is a real trust store with no secret in it. Scanner tests build their own bundle.
        clamd:
          truststore:
            location: file:${java.home}/lib/security/cacerts
  datasource:
    hikari:
      # Small pool: every Spring context in a run keeps its own pool open on the one shared database container, and
      # Oracle Free 23 runs out of server processes under a large total (ORA-12516). No test needs more.
      maximum-pool-size: 4
      minimum-idle: 1
  mail:
    # Unreachable on purpose, like the provider endpoints below: dispatcher tests start their own Mailpit.
    host: 127.0.0.1
    port: 9
  security:
    oauth2:
      client:
        provider:
          idp:
            # Unreachable on purpose: contexts start without an identity provider. KeycloakLoginIT points these at a
            # real Keycloak.
            authorization-uri: http://127.0.0.1:9/realms/test/protocol/openid-connect/auth
            token-uri: http://127.0.0.1:9/realms/test/protocol/openid-connect/token
            jwk-set-uri: http://127.0.0.1:9/realms/test/protocol/openid-connect/certs
            user-info-uri: http://127.0.0.1:9/realms/test/protocol/openid-connect/userinfo
            user-name-attribute: sub
