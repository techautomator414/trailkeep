#
# ZAP alert suppressions (BUILD_PLAN §12: fixed, or suppressed with a written justification a maintainer approves;
# the file is reviewed in PRs and suppressions expire). The only way to suppress a ZAP alert: dast-zap.sh turns each
# unexpired entry into a False Positive filter of the plan's alertFilter job, and ZapPlanTest fails a PR whose entry
# lacks any field below. It starts empty (decision Q4, WP-28).
#
# Each entry:
#   ruleId:        the ZAP rule (plugin) id, e.g. 10202
#   url:           a regular expression for the URLs it covers; as narrow as the finding
#   justification: why this alert is not a vulnerability here, in full sentences
#   reviewedIn:    the pull request in which the security reviewer approved it
#   reviewed:      that approval's date (YYYY-MM-DD)
#   expires:       at most 90 days after reviewed; an expired entry stops suppressing and the alert fails again
suppressions:
  - ruleId: 40042
    url: '^http://localhost:8081/actuator/health$'
    justification: >-
      Spring Actuator Information Leak (Medium) on GET /actuator/health of the management server, in the local
      validation of #233 (WP-28 part d), is the deliberate design, not a leak. The health endpoint is required by the
      kubelet's liveness and readiness probes, and it answers only the overall status and the names of its two probe
      groups, {"groups":["liveness","readiness"],"status":"UP"}: management.endpoint.health.show-details is left at
      its default, never, so no component or detail is shown, and /actuator/info answers an empty object. The
      management server listens on its own port, 8081, which the Service does not expose (deploy/base/service.yaml
      exposes only 8080) and which the NetworkPolicy admits only from a namespace selector for cluster monitoring
      (deploy/base/networkpolicy.yaml). The rule fires only on some runs, depending on which management node it starts
      from.
    reviewedIn: https://github.com/techautomator414/trailkeep/pull/233
    reviewed: 2026-11-16
    expires: 2027-02-14
  - ruleId: 40018
    url: '^http://localhost:8080/admin/sla-policies/\d+$'
    justification: >-
      SQL Injection (High, Medium confidence) on POST /admin/sla-policies/{id}, parameter name, in nightly run
      43712623813, is a false positive. ZAP compared the boolean payloads "ZAP AND 1=1 -- " and "ZAP OR 1=1 -- " and
      saw different responses. Since #214 a name another policy already has answers 422 with a field error and a free
      name saves and redirects, so the difference comes from which names exist, not from SQL. The name reaches the
      database only as a bound parameter of a JPA update.
    reviewedIn: https://github.com/techautomator414/trailkeep/pull/225
    reviewed: 2026-11-16
    expires: 2027-02-14
