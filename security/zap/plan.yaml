# ZAP Automation Framework plan for the authenticated full and API scan (WP-28 parts c and d, BUILD_PLAN §12.1
# "DAST"). Run by .github/workflows/zap.yml once per scan identity, against the built image in the prod profile on
# the runner's host network. The scan identity's session is not in this file: dast-zap.sh passes the "SESSION=..."
# cookie that DastSessionIT exported after a real sign-in at the dev realm through ZAP's ZAP_AUTH_HEADER,
# ZAP_AUTH_HEADER_VALUE and ZAP_AUTH_HEADER_SITE environment variables, which add it to every request to localhost. The
# alertFilter job is filled from security/zap/suppressions.yaml by dast-zap.sh; nothing else suppresses an alert.
env:
  contexts:
    # The application on 8080, and the management server's actuator on 8081 (the API scan's description names its
    # operations; in a deployment the port is reachable on the pod network only).
    - name: trailkeep
      urls:
        - http://localhost:8080/
        - http://localhost:8081/actuator
      includePaths:
        - "http://localhost:8080.*"
        - "http://localhost:8081/actuator.*"
      excludePaths:
        # Ending the scan's own session would turn the rest of the scan into a scan of the sign-in redirect.
        - "http://localhost:8080/logout"
        - "http://localhost:8080/oauth2/.*"
        - "http://localhost:8080/login/.*"
    # The second active scan's routes (#231): the application without its CSV downloads. That scan attacks the form
    # bodies of the POST paths only after the first has attacked every page, so no rule there finds a payload an
    # earlier rule stored through a form and shown back escaped (a team or case type named zj{{41120|add:69330}}zj in
    # the cases filter options, read as template injection). It attacks no query string, so the pages are here as the
    # places a stored payload can show up: the stored-XSS and template-injection rules look for their payloads on every
    # page of the context. The CSV downloads are not such places: they are attachments with nosniff, never rendered,
    # and carry titles and names verbatim by design (formula cells defused), so a case titled with a script tag would
    # read as stored XSS there. The first scan attacks them with every rule. ZapPlanTest keeps the context equal to the
    # description's application paths without the .csv ones.
    - name: trailkeep-forms
      urls:
        - http://localhost:8080/
      includePaths:
        - "http://localhost:8080.*"
      excludePaths:
        - "http://localhost:8080/logout"
        - "http://localhost:8080/oauth2/.*"
        - "http://localhost:8080/login/.*"
        - "http://localhost:8080/cases/export\\.csv"
        - "http://localhost:8080/reports/(aging|compliance)\\.csv"
        - "http://localhost:8080/reports/runs/[^/]+\\.csv"
        - "http://localhost:8080/admin/audit/export\\.csv"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # Without this job, ZAP's Insights add-on answers a High insight (the heap at 95% after a GC, in the first CI run of
  # #211) by exiting ZAP in the middle of the plan: it discards the session, so the report jobs that still run find no
  # alert, while exitStatus counts the active scan's alerts it read before. With it, a High insight stops the plan
  # instead, ZAP stays up, and the jobs marked alwaysRun below report the whole alert tree. dast-zap.sh fails a run
  # the plan stopped this way, because its scan is partial.
  - type: insights
    parameters:
      exitAutoLevel: high

  - type: alertFilter
    alertFilters: []

  # Every scanning job stays inside the trailkeep context, so the alerts the gate counts are the ones the reports
  # (which ZAP limits to the plan's contexts) show.
  # Crawl caps (WP-28 part e). The cases list links every combination of its optional filters, sort and page, and
  # without caps the spider crawled about 12,000 URLs and the active scan ran into its cap on every compliance.admin
  # run. ignore_value treats a URL whose parameter names were seen already as visited, whatever their values, and
  # maxChildren keeps at most 50 children per node. In the local measurement in the PR the two together kept every
  # route path and cut the sites tree from 3,194 to 222 nodes (compliance.admin) and from 1,964 to 188
  # (alpha.analyst); 10 children lost whole sections, 25 kept them but with no margin. Every route keeps its
  # parameters, so the active scan still attacks each of them.
  - type: spider
    parameters:
      context: trailkeep
      maxDuration: 10
      maxDepth: 10
      maxChildren: 50
      handleParameters: ignore_value

  - type: spiderAjax
    parameters:
      context: trailkeep
      inScopeOnly: true
      maxDuration: 10
      browserId: firefox-headless

  # The API scan (WP-28 part d, decision Q2): every operation of security/zap/openapi.yaml, which OpenApiCoverageTest
  # keeps complete, is requested once with the session's CSRF token and the seeded identifiers (dast-zap.sh fills
  # them in), so the active scan attacks each operation and every parameter it binds even where no page links to it
  # or the crawl caps cut it. No targetUrl: it would replace the description's per-path server, port 8081 for the
  # actuator.
  - type: openapi
    parameters:
      apiFile: /zap/wrk/openapi.yaml
      context: trailkeep

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  # The active scan runs in two parts (#231), each configured by the activeScan-config job before it (which sets the
  # input vectors for the active scans that follow, starting from ZAP's defaults each time). Their caps add up to the
  # one 120-minute cap the single scan had.
  # 1. Every page and route of the application and the management port, with every rule, but no form body attacked:
  #    query strings and the requests themselves only, so nothing the scan sends stores a payload yet.
  - type: activeScan-config
    inputVectors:
      postData:
        enabled: false

  - type: activeScan
    parameters:
      context: trailkeep
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 60

  # 2. Last, the form bodies of every POST, with every rule, over the trailkeep-forms context, and no query string,
  #    which the first part attacked. GWT and DWR bodies stay enabled as in ZAP's own defaults, so the second part's
  #    input vectors are exactly the body vectors the single scan had.
  - type: activeScan-config
    alwaysRun: true
    inputVectors:
      urlQueryStringAndDataDrivenNodes:
        enabled: false
      postData:
        enabled: true
        googleWebToolkit: true
        directWebRemoting: true

  - type: activeScan
    alwaysRun: true
    parameters:
      context: trailkeep-forms
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 60

  - type: passiveScan-wait
    alwaysRun: true
    parameters:
      maxDuration: 10

  # The crawled routes, uploaded with the reports, so that each run shows what the scan covered.
  - type: export
    alwaysRun: true
    parameters:
      context: trailkeep
      type: yaml
      source: sitestree
      fileName: /zap/wrk/reports/sites-tree.yaml

  - type: report
    alwaysRun: true
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/reports
      reportFile: zap-${SCAN_IDENTITY}
      reportTitle: Trailkeep authenticated full and API scan (${SCAN_IDENTITY})
  - type: report
    alwaysRun: true
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/reports
      reportFile: zap-${SCAN_IDENTITY}
  - type: report
    alwaysRun: true
    parameters:
      template: sarif-json
      reportDir: /zap/wrk/reports
      reportFile: zap-${SCAN_IDENTITY}.sarif

  - type: exitStatus
    alwaysRun: true
    parameters:
      errorLevel: Medium
      warnLevel: Low
