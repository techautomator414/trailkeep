#
# Local development only. Every credential here is an obviously fake dev value; nothing in this file is used by
# CI (Testcontainers starts its own databases) or by any deployment.
#   docker compose up -d                    # PostgreSQL 16 for the 'local' profile
#   docker compose --profile oracle up -d   # adds Oracle Free 23 for local Oracle parity work
#   Keycloak (dev realm) at http://localhost:8180, for the 'local' profile's OIDC login.
#   ClamAV clamd behind a TLS sidecar at localhost:3311 (ADR-0012), which scans every upload before it is stored
#   (WP-14). The dev CA and certificate are generated on first start into .local/clamd-tls/ (git-ignored).
#   Mailpit at localhost:1025 (SMTP) catches every mail the 'local' profile sends; read them at http://localhost:8025.
name: trailkeep

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trailkeep
      POSTGRES_USER: trailkeep
      POSTGRES_PASSWORD: trailkeep # dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Grantees of R__grants.sql (app.db.app-user / app.db.purge-user in application-local.yml).
      - ./deploy/local/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailkeep -d trailkeep"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    # Same image as KeycloakLoginIT. Imports deploy/local/keycloak/trailkeep-dev-realm.json on first start.
    image: keycloak/keycloak:26.0.7
    command: ["start-dev", "--http-port=8180", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin # dev-only
    ports:
      - "127.0.0.1:8180:8180"
    # Back-channel logout calls the app on the host (the realm's backchannel.logout.url).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/local/keycloak/trailkeep-dev-realm.json:/opt/keycloak/data/import/trailkeep-dev-realm.json:ro

  mailpit:
    # Same image as MailpitDispatchIT, pinned by digest. A local mail catcher: it accepts every message and delivers
    # none, so the outbox dispatcher can be watched end to end (WP-17). Both ports on loopback only.
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  clamav-tls-init:
    # DEV-ONLY, one-shot: a throwaway CA and a server certificate for localhost, generated on first start into the
    # git-ignored .local/clamd-tls/ and reused after that (delete the directory to issue new ones). The CA key is
    # deleted once it has signed. application-local.yml trusts ca.crt; nothing here is ever used outside this machine.
    image: alpine/openssl:3.5.4
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cd /tls
        [ -s server.crt ] && [ -s server.key ] && [ -s ca.crt ] && exit 0
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout ca.key -out ca.crt -days 825 \
          -subj "/CN=trailkeep-dev-only-ca" -addext "basicConstraints=critical,CA:true" \
          -addext "keyUsage=critical,keyCertSign,cRLSign"
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout server.key -out server.csr \
          -subj "/CN=localhost"
        printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > server.ext
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 -extfile server.ext \
          -out server.crt
        rm -f ca.key ca.srl server.csr server.ext
    volumes:
      - ./.local/clamd-tls:/tls

  clamav:
    # Same image as ClamdClientIT. clamd runs directly, as in the pod (deploy/base/clamav.yaml), bypassing the image's
    # /init, which would wait for a unix socket this config deliberately lacks and exit after 30 minutes. So freshclam
    # does not run on start: the signatures are the ones baked into the image tag. Only the TLS sidecar's port is
    # published: clamd's own 3310 stays inside this service's network namespace, on 127.0.0.1.
    image: clamav/clamav:1.4.3
    command: ["clamd", "--foreground=true"]
    ports:
      - "127.0.0.1:3311:3311"
    volumes:
      # clamd on 127.0.0.1 only, as in the pod (deploy/base/clamd.conf).
      - ./deploy/base/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 10s
      timeout: 5s
      retries: 30

  clamav-tls:
    # The TLS sidecar (ADR-0012), sharing clamav's network namespace as it does in the pod: TLS on 3311, forwarded to
    # clamd on 127.0.0.1:3310. Server-authenticated only (mTLS is optional and not used).
    image: ghostunnel/ghostunnel:v1.8.4
    network_mode: "service:clamav"
    depends_on:
      clamav-tls-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    command:
      - server
      - --listen=0.0.0.0:3311
      - --target=127.0.0.1:3310
      - --cert=/tls/server.crt
      - --key=/tls/server.key
      - --disable-authentication
    volumes:
      - ./.local/clamd-tls:/tls:ro

  oracle:
    profiles: ["oracle"]
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: trailkeep-dev # dev-only SYS/SYSTEM password
      APP_USER: trailkeep
      APP_USER_PASSWORD: trailkeep # dev-only
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  oracle-data:
