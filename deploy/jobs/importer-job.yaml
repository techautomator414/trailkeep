# One-off import from an existing tracker (BUILD_PLAN §15). Not part of deploy/base, because applying a Job runs it:
#   kubectl -n <namespace> apply -f deploy/jobs/importer-job.yaml
# The private mapping file and extract are mounted from a PersistentVolumeClaim the operator prepares
# (PLACEHOLDER claim name). Same image, importer profile, no web server.
apiVersion: batch/v1
kind: Job
metadata:
  name: trailkeep-importer
  labels:
    app.kubernetes.io/name: trailkeep
    app.kubernetes.io/part-of: trailkeep
    app.kubernetes.io/component: importer
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trailkeep
        app.kubernetes.io/component: importer
      annotations:
        ignore-check.kube-linter.io/no-liveness-probe: "Batch job: no server to probe; activeDeadlineSeconds bounds it."
        ignore-check.kube-linter.io/no-readiness-probe: "Batch job: it never receives traffic."
    spec:
      # Default service account (this file is applied outside the base); its token is not mounted.
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: importer
          image: ghcr.io/techautomator414/trailkeep:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: trailkeep-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod,importer
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            # clamd's StreamMaxLength, which the importer cannot read (docs/design/importer.md §4.3 "Size"): the
            # default of the ClamAV in deploy/base. In clamd mode dry-run and load refuse to start without it or when
            # it is below import.attachments.max-bytes; change it with clamd's setting.
            - name: IMPORT_ATTACHMENTS_CLAMDSTREAMMAX
              value: 100MB
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: import-data
              mountPath: /var/lib/trailkeep/import
              readOnly: true
            - name: secrets
              mountPath: /etc/trailkeep/secrets
              readOnly: true
            - name: clamav-ca
              mountPath: /etc/trailkeep/clamav-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: import-data
          persistentVolumeClaim:
            claimName: trailkeep-import-data
            readOnly: true
        # The CA certificate (no key) that authenticates the ClamAV TLS sidecar (clamav.yaml, ADR-0012).
        - name: clamav-ca
          secret:
            secretName: clamav-ca
            defaultMode: 0444
        # Reference only: the application credential, as for the web Deployment.
        - name: secrets
          secret:
            secretName: trailkeep-web
            defaultMode: 0444 # readable by whichever non-root UID the platform assigns
