# The importer (docs/design/importer.md §2.1, §10): one command for one run per Job run. Not part of deploy/base,
# because applying a Job runs it. Apply it with its NetworkPolicy, after setting the command and the run id below:
#   kubectl -n <namespace> apply -k deploy/jobs/importer                     (clamd scanning, the default)
#   kubectl -n <namespace> apply -k deploy/jobs/importer-external-scanning  (APP_ATTACHMENTS_SCANNING=external)
# Only validate-mapping and extract read the source database: apply those two with the source-access component, through
# deploy/jobs/importer-source-access or deploy/jobs/importer-external-scanning-source-access. It adds the source
# password and the route to the source together; every other command runs with neither.
# A finished Job cannot be changed: delete it (kubectl delete job trailkeep-importer) before the next command.
# Same image, importer profile, no web server. The database URL and APP_DB_SCHEMA come from trailkeep-config, as for
# the web pods; the import user does not own the tables, so on Oracle APP_DB_SCHEMA must name their owner.
apiVersion: batch/v1
kind: Job
metadata:
  name: trailkeep-importer
  labels:
    app.kubernetes.io/name: trailkeep
    app.kubernetes.io/part-of: trailkeep
    app.kubernetes.io/component: importer
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trailkeep
        app.kubernetes.io/component: importer
        # No trailkeep.io/source-egress label: the source-access component adds it (networkpolicy.yaml).
      annotations:
        ignore-check.kube-linter.io/no-liveness-probe: "Batch job: no server to probe; activeDeadlineSeconds bounds it."
        ignore-check.kube-linter.io/no-readiness-probe: "Batch job: it never receives traffic."
    spec:
      # Default service account (this file is applied outside the base); its token is not mounted.
      automountServiceAccountToken: false
      restartPolicy: Never
      # runAsUser and fsGroup are not set, so the platform's ranges apply. OpenShift's restricted-v2 SCC assigns an
      # fsGroup, which makes the two writable claims below writable; on plain Kubernetes set fsGroup in an overlay.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: importer
          image: ghcr.io/techautomator414/trailkeep:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: trailkeep-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod,importer
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            # PLACEHOLDER: one of status, validate-mapping, extract, dry-run, load, reconcile, relink-owners and
            # purge-staging, and the run id the Import runs screen shows for the run request.
            - name: IMPORT_COMMAND
              value: status
            - name: IMPORT_RUN
              value: "0"
            # PLACEHOLDER file name: the reviewed mapping file on the read-only import-data claim.
            - name: IMPORT_MAPPING
              value: /var/lib/trailkeep/import/mapping.yaml
            # Each run's content area (design §4.3) and report files (§9) are folders named by the run id under these
            # two writable claims; both folders must exist, and neither may be a symbolic link.
            - name: IMPORT_CONTENTAREA
              value: /var/lib/trailkeep/import-content
            - name: IMPORT_REPORTSDIR
              value: /var/lib/trailkeep/import-reports
            # clamd's StreamMaxLength, which the importer cannot read (docs/design/importer.md §4.3 "Size"): the
            # default of the ClamAV in deploy/base. In clamd mode dry-run and load refuse to start without it or when
            # it is below import.attachments.max-bytes; change it with clamd's setting.
            - name: IMPORT_ATTACHMENTS_CLAMDSTREAMMAX
              value: 100MB
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: import-data
              mountPath: /var/lib/trailkeep/import
              readOnly: true
            - name: import-content
              mountPath: /var/lib/trailkeep/import-content
            - name: import-reports
              mountPath: /var/lib/trailkeep/import-reports
            - name: secrets
              mountPath: /etc/trailkeep/secrets
              readOnly: true
            - name: clamav-ca
              mountPath: /etc/trailkeep/clamav-ca
              readOnly: true
      volumes:
        # The Job's secret files (Spring configtree), never the web application's credential or OIDC client secret, and
        # never the source password (the source-access component adds it, for validate-mapping and extract only):
        # - trailkeep-import: spring.datasource.username and spring.datasource.password, the TRAILKEEP_IMPORT
        #   credential, and nothing else even if the Secret holds more;
        # - trailkeep-import-hash-key: import.hash-key, its own Secret, kept for as long as the ledger is compared;
        # - trailkeep-web: app.audit.hmac-key only, the same key the web pods redact audit values with. The two HMAC
        #   keys are separate files with separate values (design §5, R2).
        # It is the first volume: the source-access component appends to its sources by index, behind a test op.
        - name: secrets
          projected:
            defaultMode: 0444 # readable by whichever non-root UID the platform assigns
            sources:
              - secret:
                  name: trailkeep-import
                  items:
                    - key: spring.datasource.username
                      path: spring.datasource.username
                    - key: spring.datasource.password
                      path: spring.datasource.password
              - secret:
                  name: trailkeep-import-hash-key
                  items:
                    - key: import.hash-key
                      path: import.hash-key
              - secret:
                  name: trailkeep-web
                  items:
                    - key: app.audit.hmac-key
                      path: app.audit.hmac-key
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        # PLACEHOLDER claim names, prepared by the operator (deploy/README.md, "Importer"): the private mapping file,
        # lookups, extract files and attachment folders, mounted read-only.
        - name: import-data
          persistentVolumeClaim:
            claimName: trailkeep-import-data
            readOnly: true
        # The content area: legacy attachment bytes a content query fetched at extract. It holds PHI, so it must be
        # encrypted at rest; purge-staging and the staging TTL delete each run's folder. Sized for the largest run's
        # source-query attachments.
        - name: import-content
          persistentVolumeClaim:
            claimName: trailkeep-import-content
        # The report files: counts, codes, keyed hashes and Trailkeep ids, never a legacy value. Kept after the
        # staging is purged, for the operator to hand to the approver.
        - name: import-reports
          persistentVolumeClaim:
            claimName: trailkeep-import-reports
        # The CA certificate (no key) that authenticates the ClamAV TLS sidecar (clamav.yaml, ADR-0012).
        - name: clamav-ca
          secret:
            secretName: clamav-ca
            defaultMode: 0444
