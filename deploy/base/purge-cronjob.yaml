# Retention purge (BUILD_PLAN §9 "Separation of duties", §16): same image, purge profile, no web server, and its
# own credential (Secret trailkeep-purge) that the web Deployment never mounts. Each run (WP-24 part c,
# io.trailkeep.retention.PurgeRunner) tombstones the archived cases past PURGE_AFTER and not on legal hold, deletes the
# report runs older than app.retention.report-runs, logs counts only and exits. Shipped suspended: an overlay sets
# suspend: false once the organization has decided its retention (deploy/README.md, "Purge schedule").
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trailkeep-purge
  labels:
    app.kubernetes.io/component: purge
spec:
  schedule: "17 3 * * *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      # No ttlSecondsAfterFinished here: successfulJobsHistoryLimit/failedJobsHistoryLimit above already bound
      # finished Jobs, and kube-linter (job-ttl-seconds-after-finished) rejects both mechanisms on one CronJob.
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trailkeep
            app.kubernetes.io/component: purge
          annotations:
            ignore-check.kube-linter.io/no-liveness-probe: "Batch job: no server to probe; activeDeadlineSeconds bounds it."
            ignore-check.kube-linter.io/no-readiness-probe: "Batch job: it never receives traffic."
        spec:
          serviceAccountName: trailkeep
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              image: ghcr.io/techautomator414/trailkeep:0.1.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: trailkeep-config
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: prod,purge
                - name: SPRING_MAIN_WEB_APPLICATION_TYPE
                  value: none
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 768Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: secrets
                  mountPath: /etc/trailkeep/secrets
                  readOnly: true
                - name: clamav-ca
                  mountPath: /etc/trailkeep/clamav-ca
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
            # The CA certificate (no key) the scanner client loads at startup (clamav.yaml, ADR-0012). Purge never
            # scans, but it runs the same application context.
            - name: clamav-ca
              secret:
                secretName: clamav-ca
                defaultMode: 0444
            # Reference only: holds the TRAILKEEP_PURGE database credential.
            - name: secrets
              secret:
                secretName: trailkeep-purge
                defaultMode: 0444 # readable by whichever non-root UID the platform assigns
