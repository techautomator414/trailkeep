apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trailkeep
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: trailkeep
      app.kubernetes.io/component: web
