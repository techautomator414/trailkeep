#
# clamd configuration for the ClamAV pod (clamav.yaml) and the local compose service (compose.yaml), ADR-0012.
# clamd listens on the loopback address only: the TLS sidecar (ghostunnel) shares the pod's network namespace and is
# the only way in. There is deliberately no LocalSocket, so `clamdscan --ping` in the probes exercises the same TCP
# listener the sidecar forwards to. Everything else is the official image's default.
LogFile /var/log/clamav/clamd.log
LogTime yes
TCPSocket 3310
TCPAddr 127.0.0.1
User clamav
