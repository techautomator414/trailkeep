# OpenShift Route with edge TLS. The host is generated by the cluster unless an overlay sets spec.host.
# For re-encrypt TLS, change termination and add destinationCACertificate in the overlay.
# Plain Kubernetes: drop this file from kustomization.yaml and use ingress-alternative.yaml.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: trailkeep
spec:
  to:
    kind: Service
    name: trailkeep
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
