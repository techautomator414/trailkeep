# Reference deployment for OpenShift (works on plain Kubernetes with ingress-alternative.yaml instead of route.yaml).
# Overlays set the namespace, the image tag or digest, the ConfigMap values and the NetworkPolicy targets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: trailkeep
      app.kubernetes.io/part-of: trailkeep
    includeSelectors: false

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - poddisruptionbudget.yaml
  - service.yaml
  - route.yaml
  - networkpolicy.yaml
  - purge-cronjob.yaml

images:
  - name: ghcr.io/techautomator414/trailkeep
    newTag: 0.1.0
