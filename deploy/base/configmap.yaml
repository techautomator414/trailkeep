# Non-secret configuration, bound by Spring's relaxed binding (APP_PROXY_PATTERN -> app.proxy.pattern).
# Every value marked PLACEHOLDER is set by the deploying organization in its overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trailkeep-config
data:
  SPRING_PROFILES_ACTIVE: prod
  # PLACEHOLDER: a regular expression (not a CIDR) matching the Route/ingress router's pod addresses. Only these
  # peers may set X-Forwarded-For / X-Forwarded-Proto. The application refuses to start if it is empty.
  APP_PROXY_PATTERN: 10\.128\.\d+\.\d+
  # PLACEHOLDER: the database users R__grants.sql grants to (BUILD_PLAN section 8 rule 7). The migration grants the
  # runtime privileges to APP_DB_APP_USER, the case-data deletions to APP_DB_PURGE_USER and the importer's staging
  # and writes to APP_DB_IMPORT_USER (docs/design/importer.md §5); all three must already exist, and the import user
  # stays locked where nothing is imported. The application refuses to start if any is empty.
  APP_DB_APP_USER: TRAILKEEP_APP
  APP_DB_PURGE_USER: TRAILKEEP_PURGE
  APP_DB_IMPORT_USER: TRAILKEEP_IMPORT
  # PLACEHOLDER: the schema that owns the tables (app.db.schema). REQUIRED on Oracle, where the runtime, purge and
  # import users own nothing: every pooled connection runs ALTER SESSION SET CURRENT_SCHEMA with it, and without it
  # native SQL fails with ORA-00942 or ORA-02289. Name the schema owner's user (upper case, a plain identifier). On
  # PostgreSQL it sets search_path to that schema (for example public); leave the value empty only where the
  # connecting user owns the tables. The web Deployment, the purge CronJob and the importer Job all read it from here.
  APP_DB_SCHEMA: TRAILKEEP_OWNER
  # Who scans uploads for malware (ADR-0013). clamd (the default): every upload is scanned by the ClamAV below before
  # it is stored, fail-closed. external: the organization scans upstream (gateway, ICAP proxy) or at the endpoints;
  # Trailkeep stores files as NOT_SCANNED, never as clean, and needs neither the two clamd entries below nor
  # clamav.yaml (deploy/README.md, overlays/external-scanning). Read at startup: changing it is a redeploy.
  # APP_ATTACHMENTS_SCANNING: clamd
  # The ClamAV Service in clamav.yaml, reached over TLS on 3311 (ADR-0012); its certificate must name this host. Every
  # upload is scanned before it is stored and is refused while the scanner is unreachable. clamd's StreamMaxLength
  # must be at least app.attachments.max-bytes (25MB); its default (100M) is.
  APP_ATTACHMENTS_CLAMD_HOST: clamav
  # The "clamd" SSL bundle: the CA that issued the clamav-tls certificate, mounted from the clamav-ca Secret.
  SPRING_SSL_BUNDLE_PEM_CLAMD_TRUSTSTORE_CERTIFICATE: file:/etc/trailkeep/clamav-ca/ca.crt
  APP_TIMEZONE: UTC
  APP_BRANDING_NAME: Trailkeep
  # PLACEHOLDER: the address people open Trailkeep at; every deep link in a mail starts with it. Required.
  APP_BASE_URL: https://trailkeep.example.org
  # PLACEHOLDER: outgoing mail (WP-17). The relay must offer STARTTLS (the egress NetworkPolicy allows 587). A relay
  # that needs a login reads spring.mail.username and spring.mail.password from secret files. APP_MAIL_ENABLED=false
  # stops sending while mail keeps queuing in the outbox; it is sent once the value is true again.
  SPRING_MAIL_HOST: smtp.example.org
  SPRING_MAIL_PORT: "587"
  APP_MAIL_FROM: Trailkeep <trailkeep@example.org>
  # APP_MAIL_ENABLED: "true"
  # Secret values are files under this directory (one file per property name), never environment variables.
  SPRING_CONFIG_IMPORT: configtree:/etc/trailkeep/secrets/
