version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "*:*-maven-plugin"
        update-types: [minor, patch]
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
