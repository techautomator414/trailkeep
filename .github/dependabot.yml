version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    # Two deliberate pins, each explained next to its version in pom.xml and declined as a PR; without these rules
    # Dependabot proposes the same bump again.
    ignore:
      # Upload type detection stays on tika-core 3.x: 4.x breaks MimeTypes.detect and pulls in commonmark extensions a
      # magic-byte detector does not need (pom.xml `tika.version`; declined in #130).
      - dependency-name: "org.apache.tika:tika-core"
        versions: [">= 4"]
      # Compile-only annotation jar kept at 4.3.1: later releases declare their licence as "(Apache-2.0 OR EPL-2.0)",
      # which the third-party licence check cannot read (pom.xml, `biz.aQute.bnd.annotation`; declined in #131).
      - dependency-name: "biz.aQute.bnd:biz.aQute.bnd.annotation"
        versions: [">= 5"]
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "*:*-maven-plugin"
        update-types: [minor, patch]
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # The container images the integration tests start (#235): one Dockerfile per image under
  # src/test/resources/images/, `FROM repo:tag@sha256:digest`, read by TestImages. Dependabot proposes the tag and the
  # digest together; one grouped PR a week for all of them. The glob lists every image directory, so a new image is
  # covered by adding its directory (ImageSourcesTest checks this entry is present).
  - package-ecosystem: docker
    directories:
      - "/src/test/resources/images/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      test-images:
        patterns:
          - "*"

  # The images compose.yaml starts for local development and the DAST stack (#256). ComposeImagesTest keeps each equal to
  # its test image under src/test/resources/images/ (or, for the compose-only alpine/openssl, digest-pinned), so the
  # weekly test-images PR above and this one must land together; a PR that moves only one fails that test.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      compose-images:
        patterns:
          - "*"
