version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    # Two deliberate pins, each explained next to its version in pom.xml and declined as a PR; without these rules
    # Dependabot proposes the same bump again.
    ignore:
      # Upload type detection stays on tika-core 3.x: 4.x breaks MimeTypes.detect and pulls in commonmark extensions a
      # magic-byte detector does not need (pom.xml `tika.version`; declined in #130).
      - dependency-name: "org.apache.tika:tika-core"
        versions: [">= 4"]
      # Compile-only annotation jar kept at 4.3.1: later releases declare their licence as "(Apache-2.0 OR EPL-2.0)",
      # which the third-party licence check cannot read (pom.xml, `biz.aQute.bnd.annotation`; declined in #131).
      - dependency-name: "biz.aQute.bnd:biz.aQute.bnd.annotation"
        versions: [">= 5"]
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "*:*-maven-plugin"
        update-types: [minor, patch]
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
