#
# Fork-safe pipeline (IMPLEMENTATION_PLAN Part G, "Fork PR" column). Needs no secrets.
# Checks that need secrets (SonarCloud, Dependency-Check, Oracle IT, container scans) live in main.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# Each job cancels its own earlier run for the same pull request. A push to main is grouped by its commit instead, so
# a second merge never cancels the first merge's run: Part E needs every merge's full set green on main.

jobs:
  build:
    name: build (./mvnw verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: ci-build-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install the Playwright browser for the E2E/axe tests
        # Same Playwright version as playwright.version in pom.xml, so the Java client finds this Chromium build.
        # --with-deps installs the system libraries; CI=true makes ShellAccessibilityIT fail rather than skip.
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Upload test, coverage and SBOM reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/bom.json
          if-no-files-found: ignore
          retention-days: 14

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: ci-gitleaks-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # The automatic, read-only job token; no license key is needed for a personal-account repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ci-semgrep-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Semgrep
        # Hash-pinned: .github/requirements/semgrep.txt is generated from semgrep.in (see the header there).
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r .github/requirements/semgrep.txt

      - name: Test custom rules
        run: |
          if [ -d security/semgrep ]; then
            semgrep --test --metrics=off security/semgrep/
          else
            echo "security/semgrep/ not present yet; no custom rules to test."
          fi

      - name: Scan
        run: |
          configs=(--config p/default --config p/java --config p/secrets)
          if [ -d security/semgrep ]; then
            configs+=(--config security/semgrep/)
          fi
          # Rule test fixtures contain deliberate violations; they are exercised by the step above.
          # django-no-csrf-token is a Django-template rule in p/default that looks for {% csrf_token %}; it cannot see
          # Thymeleaf's th:name/th:value or the token th:action injects, so it fires on every POST form here. CSRF
          # enforcement is proven by SecurityDefaultsIT and WebShellIT. Excluded by owner decision (PR 9, #19).
          semgrep scan "${configs[@]}" --exclude security/semgrep --error --metrics=off \
            --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token

  dco:
    name: dco (Signed-off-by on every commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: ci-dco-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for commit in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            author="$(git log -1 --format='%an' "$commit")"
            if [ "$author" = "dependabot[bot]" ]; then
              echo "skip ${commit} (dependabot[bot])"
              continue
            fi
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -q '[^[:space:]]'; then
              echo "ok   ${commit}"
            else
              echo "::error title=DCO::Commit ${commit} has no Signed-off-by trailer. Amend with 'git commit -s'."
              missing=1
            fi
          done
          exit "$missing"

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: ci-actionlint-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: true
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Lint workflows (with shellcheck)
        run: '"${RUNNER_TEMP}/actionlint" -color'
