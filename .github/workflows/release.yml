#
# Release column of IMPLEMENTATION_PLAN Part G, on a v* tag: every main gate, a full verify, the image pushed to
# GHCR, a keyless cosign signature and SBOM attestation, SLSA provenance, and a GitHub Release carrying the evidence
# pack (BUILD_PLAN §12.3). GHCR and cosign use only the job token and GitHub's OIDC token; no secrets are needed.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/techautomator414/trailkeep

jobs:
  main-gates:
    name: main gates
    uses: ./.github/workflows/main.yml
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  verify:
    name: build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/generated-sources/license/THIRD-PARTY.txt
          if-no-files-found: ignore
          retention-days: 90

  publish:
    name: image (push, sign, attest)
    needs: [main-gates, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR with the job token
      id-token: write # keyless cosign signing (Sigstore Fulcio via GitHub OIDC)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install scanners
        uses: ./.github/actions/setup-scanners

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Build the image from digest-pinned UBI 9 bases
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/build-image.sh "${IMAGE}:${version}" "${version}"

      - name: Scan the exact image that will be pushed (fails on fixable HIGH or CRITICAL)
        # Same policy as main.yml (issue #11): unfixed base-image findings are reported in the evidence pack,
        # not gated on.
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}:${GITHUB_REF_NAME#v}"

      - name: Push to GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          ref="${IMAGE}:${GITHUB_REF_NAME#v}"
          docker push "${ref}"
          repo_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${ref}")"
          digest="${repo_digest#*@}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          mkdir -p evidence
          echo "${IMAGE}@${digest}" > evidence/image-digest.txt
          cp target/image/base-images.txt evidence/

      - name: Sign the image and attest the SBOM (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate sbom/bom.json "${IMAGE}@${DIGEST}"
          cp sbom/bom.json evidence/bom.json
          cosign sign-blob --yes --bundle evidence/bom.json.sigstore.json evidence/bom.json

      - name: Upload signing evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 90

  provenance:
    name: SLSA provenance
    needs: publish
    permissions:
      actions: read # read the workflow run
      id-token: write # sign the provenance
      packages: write # attach the provenance to the image in GHCR
    # The SLSA generator must be referenced by tag, not by commit SHA: it verifies its own ref to establish the
    # builder identity (slsa-framework/slsa-github-generator README, "Referencing SLSA builders and generators").
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/techautomator414/trailkeep
      digest: ${{ needs.publish.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: GitHub Release with evidence pack
    needs: [publish, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
    steps:
      - name: Download every report from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Assemble the evidence pack
        run: |
          set -euo pipefail
          mkdir -p pack
          cp artifacts/image-evidence/* pack/
          for dir in test-reports trivy-sbom-report image-scan-reports dependency-check-report; do
            if [ -d "artifacts/${dir}" ]; then
              (cd artifacts && zip -qr "../pack/${dir}.zip" "${dir}")
            fi
          done
          find artifacts -maxdepth 1 -name 'oracle-it-reports-*' -type d | while read -r dir; do
            name="$(basename "$dir")"
            (cd artifacts && zip -qr "../pack/${name}.zip" "${name}")
          done
          (cd pack && sha256sum -- * > SHA256SUMS)
          ls -l pack

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          notes="Image: \`${IMAGE}@${DIGEST}\`

          Verify the signature:
          \`\`\`
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          SLSA provenance is attached to the image in GHCR. The evidence pack (SBOM, scan reports, test reports) is
          attached below; see CHANGELOG.md for changes."
          gh release create "${GITHUB_REF_NAME}" pack/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "${notes}"
