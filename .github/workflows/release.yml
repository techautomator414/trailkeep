#
# Release column of IMPLEMENTATION_PLAN Part G, on a v* tag: every main gate, a full verify, the authenticated ZAP
# scan (a Medium or higher finding stops the release), the image pushed to GHCR, a keyless cosign signature and SBOM
# attestation, SLSA provenance, and a GitHub Release carrying the evidence pack (BUILD_PLAN §12.3). GHCR and cosign use only the job token and GitHub's OIDC token; no secrets are needed.
# The pack's contents are .github/release/evidence-pack.txt, built and checked by .github/scripts/evidence-pack.py
# (WP-30 part d, pinned by ReleaseEvidencePackTest); docs/RELEASING.md is the procedure, owner steps included.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/techautomator414/trailkeep

jobs:
  # What the release needs from the repository and the tag, checked before anything is built or published: the
  # CHANGELOG section for this version, every checked-in file the evidence pack requires (from 1.0.0, none a draft), and
  # the tag itself. From 1.0.0 the tag must be an annotated tag whose signature GitHub verifies against a signing key on
  # the tagger's account (docs/RELEASING.md); before that its state is recorded, not required.
  preflight:
    name: preflight (CHANGELOG, required files, signed tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag and its signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p preflight
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          type="$(jq -r .object.type <<< "${ref}")"
          object="$(jq -r .object.sha <<< "${ref}")"
          if [ "${type}" = tag ]; then
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object}")"
            target="$(jq -r .object.sha <<< "${tag}")"
            verified="$(jq -r .verification.verified <<< "${tag}")"
            reason="$(jq -r .verification.reason <<< "${tag}")"
            format="$(jq -r '(.verification.signature // "" | split("\n")[0]) // ""' <<< "${tag}")"
          else
            target="${object}" verified=false reason="lightweight tag: no tag object, so no signature" format=""
          fi
          {
            echo "tag: ${GITHUB_REF_NAME} (${type} ${object})"
            echo "commit: ${target}"
            echo "signature: ${format:-none}"
            echo "verified by GitHub: ${verified} (${reason})"
          } | tee preflight/tag-signature.txt
          if [ "${target}" != "${GITHUB_SHA}" ]; then
            echo "::error::the tag points at ${target}, but this run builds ${GITHUB_SHA}"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if [ "${version%%.*}" -ge 1 ] && [ "${verified}" != true ]; then
            echo "::error::${GITHUB_REF_NAME} must be a signed, annotated tag that GitHub verifies (docs/RELEASING.md)"
            exit 1
          fi

      # Without these secrets main.yml skips SonarCloud and Dependency-Check with a notice (issue 30). From 1.0.0 that
      # is not allowed: the 1.0.0 exit criterion is 0 open findings in every scanner.
      - name: Require the secret-gated scans from 1.0.0
        env:
          SONAR: ${{ secrets.SONAR_TOKEN != '' }}
          NVD: ${{ secrets.NVD_API_KEY != '' }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ "${version%%.*}" -ge 1 ] && { [ "${SONAR}" != true ] || [ "${NVD}" != true ]; }; then
            echo "::error::${GITHUB_REF_NAME} needs SONAR_TOKEN and NVD_API_KEY, so no scanner is skipped (issue 30)"
            exit 1
          fi

      - name: Check the required files and cut the CHANGELOG section
        run: python3 -I .github/scripts/evidence-pack.py preflight --tag "${GITHUB_REF_NAME}" --out preflight

      - name: Upload the preflight evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preflight
          path: preflight
          if-no-files-found: error
          retention-days: 90

  main-gates:
    name: main gates
    uses: ./.github/workflows/main.yml
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  verify:
    name: build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          # No Maven cache here on purpose: this job signs and publishes, and a cache restored by key prefix from any
          # earlier main-branch workflow would put its contents into the artifact (issue 224).

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/generated-sources/license/THIRD-PARTY.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload the static analysis reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-analysis
          path: |
            target/spotbugsXml.xml
            target/checkstyle-result.xml
          if-no-files-found: error
          retention-days: 90

  # The in-process performance run at the 50k and 500k seed (perf.yml, the same job as nightly): a p95 past its target
  # stops the release, and its tables go into the evidence pack. Cold, like verify: no Maven cache reaches a release.
  perf:
    name: perf
    uses: ./.github/workflows/perf.yml
    with:
      maven-cache: false
    permissions:
      contents: read

  # The authenticated ZAP full scan of an image built from this commit (WP-28): not the published image itself, which
  # publish builds again (the Containerfile's microdnf upgrade can make two builds differ). Publishing waits for it,
  # so any alert of Medium or higher that security/zap/suppressions.yaml does not suppress fails the release (Q4).
  zap:
    name: zap
    uses: ./.github/workflows/zap.yml
    with:
      mode: release
    permissions:
      contents: read

  publish:
    name: image (push, sign, attest)
    needs: [preflight, main-gates, verify, zap, perf]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR with the job token
      id-token: write # keyless cosign signing (Sigstore Fulcio via GitHub OIDC)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install scanners
        uses: ./.github/actions/setup-scanners

      - name: Download the Trivy databases (always fresh, never cached)
        uses: ./.github/actions/trivy-db
        with:
          cache: "false"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Restore the checksum-pinned Maven distribution for the image build
        # Only the zip pinned by distributionSha256Sum, never repository contents: build-image.sh verifies it before use
        # and downloads once if it is missing or does not match (issue 240). Exact key, no restore-keys.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/image/maven-seed
          key: maven-seed-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Build the image from digest-pinned UBI 9 bases
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # cold: the published image resolves every dependency from Maven Central, never from a cache (issues 230,
          # 290). A 429 here is waited out by the resolver retry, or the release is re-run.
          .github/scripts/build-image.sh "${IMAGE}:${version}" "${version}" cold

      - name: Scan the exact image that will be pushed (fails on fixable HIGH or CRITICAL)
        # Same policy as main.yml (issue #11): unfixed base-image findings are reported in the evidence pack,
        # not gated on.
        run: trivy image --skip-db-update --skip-java-db-update --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}:${GITHUB_REF_NAME#v}"

      - name: Push to GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          ref="${IMAGE}:${GITHUB_REF_NAME#v}"
          docker push "${ref}"
          repo_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${ref}")"
          digest="${repo_digest#*@}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          mkdir -p evidence
          echo "${IMAGE}@${digest}" > evidence/image-digest.txt
          cp target/image/base-images.txt evidence/

      - name: Sign the image and attest the SBOM (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate sbom/bom.json "${IMAGE}@${DIGEST}"
          cp sbom/bom.json evidence/bom.json
          cosign sign-blob --yes --bundle evidence/bom.json.sigstore.json evidence/bom.json

      - name: Upload signing evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 90

  provenance:
    name: SLSA provenance
    needs: publish
    permissions:
      actions: read # read the workflow run
      id-token: write # sign the provenance
      packages: write # attach the provenance to the image in GHCR
    # The SLSA generator must be referenced by tag, not by commit SHA: it verifies its own ref to establish the
    # builder identity (slsa-framework/slsa-github-generator README, "Referencing SLSA builders and generators").
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/techautomator414/trailkeep
      digest: ${{ needs.publish.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify-published:
    name: verify the published image
    # The signature, the SBOM attestation and the provenance, checked as a user would check them, against the digest just
    # pushed (issue 249). A failure stops the release before it has a GitHub Release.
    needs: [publish, provenance]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/verify-image.yml
    with:
      tag: ${{ github.ref_name }}
      digest: ${{ needs.publish.outputs.digest }}

  github-release:
    name: GitHub Release with evidence pack
    needs: [publish, provenance, verify-published]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
      id-token: write # keyless signature of the pack's SHA256SUMS
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # EVIDENCE.md gives each checked-in file's last commit

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Download every report from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # Every file comes from this run's artifacts or the tagged checkout; a required file that cannot be produced fails
      # the release here, before anything is published.
      - name: Assemble the evidence pack
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: >-
          python3 -I .github/scripts/evidence-pack.py assemble --tag "${GITHUB_REF_NAME}" --image "${IMAGE}"
          --digest "${DIGEST}" --repository "${GITHUB_REPOSITORY}"
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          --artifacts artifacts --pack pack

      - name: Sign the checksums (keyless) and verify the signature
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle pack/SHA256SUMS.sigstore.json pack/SHA256SUMS
          cosign verify-blob --bundle pack/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com pack/SHA256SUMS

      - name: Check the evidence pack
        run: |
          set -euo pipefail
          python3 -I .github/scripts/evidence-pack.py check --tag "${GITHUB_REF_NAME}" --pack pack
          ls -l pack

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          notes="Image: \`${IMAGE}@${DIGEST}\`

          The release workflow verified all three artefacts below against this digest before publishing this release.
          The signature and the CycloneDX SBOM attestation use cosign's bundle format (cosign **v3** or later):
          \`\`\`
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation --type cyclonedx ${IMAGE}@${DIGEST} \\
            --certificate-identity 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          The SLSA provenance comes from slsa-github-generator in the earlier cosign format, which cosign v3 does not read;
          verify it with slsa-verifier:
          \`\`\`
          slsa-verifier verify-image ${IMAGE}@${DIGEST} \\
            --source-uri github.com/${GITHUB_REPOSITORY} --source-tag ${GITHUB_REF_NAME}
          \`\`\`
          or with cosign v2 (\`verify-attestation --type slsaprovenance\` and
          \`--certificate-identity-regexp '^https://github.com/slsa-framework/slsa-github-generator/'\`).

          The evidence pack is attached below: \`EVIDENCE.md\` maps each requirement to its file, \`VERIFY.md\` has every
          verification command (the pack's own \`SHA256SUMS\` is signed too), and \`CHANGELOG-section.md\` lists the changes."
          gh release create "${GITHUB_REF_NAME}" pack/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "${notes}"
