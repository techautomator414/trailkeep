#
# Authenticated ZAP full and API scan (WP-28 parts c and d; IMPLEMENTATION_PLAN Part G "ZAP authenticated full + API
# scan", nightly and release tag; BUILD_PLAN §12.1 "DAST", gate 0 Medium+). Called by nightly.yml (reports; a red run
# blocks no merge) and release.yml (publishing waits for it, so any Medium or higher finding fails the release), and
# runnable by hand. One job per scan identity (decision Q3), each on its own ephemeral stack:
#   - the image built from this commit by build-image.sh, run in the prod profile on the host network, wired to the
#     compose PostgreSQL, Keycloak dev realm and ClamAV with dev-only values; the audit HMAC key is generated per run;
#     the per-person rate limits on search and upload (#247) are raised to the test-profile values (100000) and stay
#     enabled: the scanner is exempted from availability throttling so the active scan reaches the application (at the
#     production limits it was answered 429 for almost every request, which ZAP's boolean SQL-injection rule reads as an
#     injection, #270). RateLimitIT verifies the control itself;
#   - DastSessionIT (-Pdast) signs the dev-realm people in through Chromium, seeds a small synthetic data set and
#     writes the identity's SESSION cookie, its CSRF token and the data set's identifiers to target/dast (never
#     uploaded);
#   - ZAP, pinned by digest, runs security/zap/plan.yaml with that cookie: the crawl, then the hand-written API
#     description security/zap/openapi.yaml, then the active scan of both, in two parts: every route with no form body
#     attacked, then the POST paths' form bodies last (#231). It fails on any alert of Medium or higher
#     that security/zap/suppressions.yaml does not suppress (every entry carries a reviewed justification and an
#     expiry).
# No secret is used: the job token reads the repository and nothing else.
name: zap

on:
  workflow_call:
    inputs:
      mode:
        # release: a partial scan (the active scan cut off at its cap, or the plan stopped by a High insight) fails.
        # nightly: it warns. Every other check fails in both (dast-verdict.sh, pinned by DastVerdictTest).
        description: release or nightly
        type: string
        required: true
  workflow_dispatch:
    inputs:
      mode:
        description: release or nightly
        type: choice
        options: [nightly, release]
        default: nightly

permissions: {}

jobs:
  scan:
    name: zap (${{ matrix.identity }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        identity: [compliance.admin, alpha.analyst]
    env:
      IMAGE: localhost/trailkeep:dast
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af # 2.17.0
      SCAN_IDENTITY: ${{ matrix.identity }}
      ZAP_MODE: ${{ inputs.mode }}
      ZAP_HEAP: 6g
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore the Maven repository and wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          # One cache per job (issue 244): GitHub keeps the first save for a key, so a key shared by jobs with different
          # needs holds whatever the first job to finish resolved. Each job saves what it needs. A pom change restores
          # this job's newest earlier cache, then any job's, so Maven Central is asked for what changed, not for
          # everything (issue 224).
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-

      - name: Install the Playwright browser for DastSessionIT
        # Same Playwright version as playwright.version in pom.xml (as in ci.yml).
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Restore the checksum-pinned Maven distribution for the image build
        # Only the zip pinned by distributionSha256Sum, never repository contents: build-image.sh verifies it before use
        # and downloads once if it is missing or does not match (issue 240). Exact key, no restore-keys.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/image/maven-seed
          key: maven-seed-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Build the image from digest-pinned UBI 9 bases, resolving dependencies offline
        # The scan image is never published, in either mode, so it may resolve from this job's cache (issue 290).
        run: .github/scripts/build-image.sh "${IMAGE}" "0.0.0-dast+${GITHUB_SHA::12}" offline

      - name: Start PostgreSQL, Keycloak, ClamAV and Mailpit
        run: docker compose up --detach --wait postgres keycloak mailpit clamav clamav-tls

      - name: Start the image in the prod profile
        run: .github/scripts/dast-app.sh start "${IMAGE}"

      - name: Seed the stack and export the scan sessions
        run: ./mvnw -B -ntp -Pdast test-compile org.apache.maven.plugins:maven-failsafe-plugin:integration-test@dast org.apache.maven.plugins:maven-failsafe-plugin:verify@dast

      - name: Scan as ${{ matrix.identity }}
        run: .github/scripts/dast-zap.sh "${SCAN_IDENTITY}"

      - name: Stop the image and keep its log
        if: always()
        run: .github/scripts/dast-app.sh stop

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reports-${{ matrix.identity }}
          # Never target/dast: it holds the session cookies.
          path: |
            target/zap
            target/failsafe-reports/dast
          if-no-files-found: ignore
          retention-days: 90
